<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#bf5f2f">
<title>上岸 · 考公备考工作台</title>
<!-- PWA 配置 -->
<link rel="manifest" href="manifest.json">
<!-- iOS Safari 支持 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="上岸">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23bf5f2f'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>岸</text></svg>">
<!-- Android Chrome 支持 -->
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23bf5f2f'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>岸</text></svg>">
<style>
/* ================= 基础 ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg:#f6efe1;--card:#fffaf1;--card2:#fdf6e8;
 --line:#e9dcc0;--line2:#efe3cc;
 --ink:#4a3a26;--ink2:#7a6a50;--ink3:#a5926f;
 --acc:#bf5f2f;--acc2:#d98a4b;--accsoft:#f7e2cf;--accdeep:#9c4a22;
 --green:#5f8b4b;--greensoft:#e6efdc;
 --blue:#4a7a9b;--bluesoft:#e2ecf3;
 --red:#c24f3a;--redsoft:#f6e0da;
 --gold:#c9992f;--goldsoft:#f6ecd4;
 --sh:0 8px 24px rgba(122,92,56,.10);
}
html,body{height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Segoe UI",sans-serif;background:
 radial-gradient(1100px 520px at 88% -10%, rgba(217,138,75,.14), transparent 60%),
 radial-gradient(900px 520px at -12% 108%, rgba(201,153,47,.12), transparent 60%),
 var(--bg);color:var(--ink);overflow:hidden}
::selection{background:rgba(191,95,47,.22)}
button{font-family:inherit}
.main::-webkit-scrollbar,.m-card::-webkit-scrollbar{width:9px;height:9px}
.main::-webkit-scrollbar-thumb,.m-card::-webkit-scrollbar-thumb{background:#e0d0ae;border-radius:99px}
.main::-webkit-scrollbar-track,.m-card::-webkit-scrollbar-track{background:transparent}

/* ================= 加载动画 ================= */
#loader{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#faf1dd 0%,#f5e6c9 55%,#eed8b4 100%);transition:opacity .7s ease,visibility .7s}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
.ld{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;z-index:2}
.ld-chars{display:flex;gap:16px;animation:bob 3.4s ease-in-out 1.9s infinite}
.char{font-size:96px;font-weight:900;letter-spacing:4px;color:var(--accdeep);opacity:0;filter:blur(20px);transform:translateY(54px) scale(1.4);clip-path:inset(100% 0 0 0);animation:charIn 1.05s cubic-bezier(.22,.9,.28,1) forwards;text-shadow:0 6px 26px rgba(191,95,47,.28)}
.char:nth-child(2){animation-delay:.45s}
@keyframes charIn{0%{opacity:0;filter:blur(20px);transform:translateY(54px) scale(1.4);clip-path:inset(100% 0 0 0)}55%{opacity:1;filter:blur(3px);transform:translateY(-6px) scale(.97);clip-path:inset(0 0 0 0)}75%{filter:blur(0);transform:translateY(4px) scale(1.02)}100%{opacity:1;filter:blur(0);transform:none;clip-path:inset(0 0 0 0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ld-wave{width:0;height:4px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--acc2),transparent);animation:waveGrow .9s ease-out .9s forwards;box-shadow:0 0 18px rgba(217,138,75,.55)}
@keyframes waveGrow{to{width:218px}}
.ld-sub{color:var(--ink2);font-size:15px;letter-spacing:3px;opacity:0;animation:fadeUp .6s ease 1.15s forwards}
.ld-sub .dot{animation:dotBlink 1.2s infinite}
.ld-sub .d2{animation-delay:.15s}.ld-sub .d3{animation-delay:.3s}
@keyframes dotBlink{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ripple{position:absolute;width:200px;height:200px;border-radius:50%;border:2px solid rgba(191,95,47,.28);animation:rip 2.1s ease-out infinite;pointer-events:none}
.ripple.r2{animation-delay:1.05s}
@keyframes rip{0%{transform:scale(.38);opacity:.9}100%{transform:scale(2.15);opacity:0}}

/* ================= 布局 ================= */
#app{display:flex;height:100vh}
.side{width:228px;flex:none;height:100%;background:linear-gradient(180deg,#faf2df,#f3e4c6);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:12px;padding:2px 6px 18px;border-bottom:1px dashed var(--line2);margin-bottom:14px}
.logo-mark{width:46px;height:46px;flex:none;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:23px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(191,95,47,.35)}
.logo-name{font-size:21px;font-weight:900;color:var(--accdeep);letter-spacing:3px}
.logo-sub{font-size:11px;color:var(--ink3);letter-spacing:1px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border:none;border-radius:12px;background:transparent;color:var(--ink2);font-size:14.5px;font-weight:600;cursor:pointer;transition:all .18s;text-align:left}
.nav-item .ic{font-size:17px}
.nav-item:hover{background:rgba(191,95,47,.08);color:var(--ink)}
.nav-item.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 14px rgba(191,95,47,.3)}
.nav-item .badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,.85);color:var(--accdeep);border-radius:99px;padding:2px 8px;font-weight:700}
.nav-item.active .badge{background:rgba(255,255,255,.9)}
.nav-item .badge.badge-warn{background:var(--redsoft);color:var(--red)}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px dashed var(--line2);font-size:12px;color:var(--ink3);line-height:1.9;letter-spacing:1px}
.side-foot span{color:#b39a72}
.main{flex:1;min-width:0;height:100%;overflow-y:auto;padding:26px 30px 60px}
.view{display:none;max-width:1200px;margin:0 auto}
.view.active{display:block;animation:viewIn .4s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.v-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.v-title{font-size:24px;font-weight:900;letter-spacing:1px}
.v-sub{font-size:13px;color:var(--ink3);margin-top:5px}

/* ================= 卡片与统计 ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;line-height:1.4;flex:1;min-width:0}
.card-h h3 .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.stat{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;transition:transform .18s}
.stat:hover{transform:translateY(-2px)}
.stat .s-lab{font-size:12.5px;color:var(--ink3);font-weight:600}
.stat .s-num{font-size:25px;font-weight:800;color:var(--accdeep);margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .s-num small{font-size:13px;color:var(--ink3);font-weight:600}
.stat .s-sub{font-size:12px;color:var(--ink3);margin-top:4px}

/* ================= 按钮 / 表单 ================= */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:11px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 12px rgba(191,95,47,.28);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(191,95,47,.34);filter:brightness(1.04)}
.btn:active{transform:translateY(0)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.ghost,.btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover,.btn-ghost:hover{background:var(--accsoft);color:var(--accdeep);box-shadow:none}
.btn-danger{background:linear-gradient(135deg,#c24f3a,#d4765f);box-shadow:0 4px 12px rgba(194,79,58,.25)}
.btn.green{background:linear-gradient(135deg,#5f8b4b,#7aa768);box-shadow:0 4px 12px rgba(95,139,75,.25)}
.link-btn{background:none;border:none;color:var(--acc);font-weight:700;font-size:12.5px;cursor:pointer}
.link-btn:hover{text-decoration:underline}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);background:#fffdf6;border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;width:100%;transition:border .15s,box-shadow .15s}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;min-height:40px}
input[type=date]::-webkit-inner-spin-button,input[type=date]::-webkit-calendar-picker-indicator{opacity:.5}
/* 隐藏数字输入框右侧的上下增减箭头，纯手动输入 */
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(217,138,75,.15)}
textarea{resize:vertical;min-height:88px;line-height:1.7}
label{font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.5px}
.f-row{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--ink2);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--acc2);color:var(--accdeep)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(191,95,47,.3)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tag{display:inline-flex;align-items:center;border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag-xc{background:var(--accsoft);color:var(--accdeep)}
.tag-sl{background:var(--bluesoft);color:var(--blue)}
.tag-gold{background:var(--goldsoft);color:var(--gold)}
.tag-green{background:var(--greensoft);color:var(--green)}
.tag-red{background:var(--redsoft);color:var(--red)}
.tag-gray{background:#efe8d8;color:var(--ink3)}

.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line2)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.tbl th{background:var(--card2);color:var(--ink2);text-align:left;padding:10px 12px;font-size:12px;letter-spacing:.5px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px dashed var(--line2);vertical-align:middle}
.tbl tr:hover td{background:#fdf8ec}

.t-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card2);border:1px solid var(--line2);border-radius:13px}
.t-item+.t-item{margin-top:10px}
.t-item.done{opacity:.66}
.t-item.done .t-title{text-decoration:line-through;color:var(--ink3)}
.t-title{font-size:14.5px;font-weight:700}
.t-meta{font-size:12px;color:var(--ink3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;line-height:1.7}
.t-info{flex:1;min-width:0}
.t-right{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.rate-badge{font-size:12px;font-weight:800;color:var(--green);background:var(--greensoft);border-radius:99px;padding:3px 10px}

.bar{height:10px;border-radius:99px;background:#efe3ca;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s ease}
.bar>i.green{background:linear-gradient(90deg,#5f8b4b,#7aa768)}

/* 学习板块分布 */
.sec-row{margin-bottom:16px}
.sec-row:last-child{margin-bottom:0}
.sec-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.sec-name{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--ink)}
.sec-dot{width:9px;height:9px;border-radius:50%;flex:none}
.sec-val{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sec-val b{color:var(--accdeep);font-weight:800}
.sec-bar{height:10px;border-radius:99px;background:#efe3ca;overflow:hidden}
.sec-bar>i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.sec-empty{text-align:center;color:var(--ink3);font-size:13px;padding:24px 0}
/* 二级模块分组 */
.mod-group{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line2)}
.mod-group:first-child{margin-top:0;padding-top:0;border-top:0}
.mod-group-h{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:12px}
.mod-row{margin-bottom:12px;padding-left:16px}
.mod-row:last-child{margin-bottom:0}
.mod-name{font-weight:600;font-size:13px;color:var(--ink2)}

/* ================= 首页 ================= */
.cd-big{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cd-cell{flex:1;min-width:74px;max-width:112px;background:linear-gradient(180deg,#fffefb,#fbeed8);border:1px solid var(--line);border-radius:14px;padding:14px 6px 10px;text-align:center;box-shadow:inset 0 -3px 0 rgba(191,95,47,.08)}
.cd-num{font-size:34px;font-weight:900;color:var(--accdeep);font-variant-numeric:tabular-nums;line-height:1.1}
.cd-lab{font-size:12px;color:var(--ink3);margin-top:6px;letter-spacing:2px}
.cd-state{margin-top:12px;text-align:center;font-size:12.5px;color:var(--ink3)}
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:10px}
.node{background:#fffdf6;border:1px dashed #e2d0ab;border-radius:12px;padding:10px 12px}
.node .n-lab{font-size:12.5px;font-weight:700;color:var(--ink2)}
.node .n-date{font-size:11.5px;color:var(--ink3);margin-top:2px}
.node .n-cd{margin-top:6px;font-size:13.5px;font-weight:800;color:var(--accdeep);font-variant-numeric:tabular-nums}
.node .n-cd b{font-size:14px}
.node .n-cd .past{color:var(--ink3);font-weight:600}
.exam-chip{display:inline-flex;align-items:center;gap:8px;background:var(--accsoft);color:var(--accdeep);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700}
.study-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring-box{position:relative;width:118px;height:118px;flex:none}
.ring{width:118px;height:118px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .rbg{stroke:#f0e3c8}
.ring .rfg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num b{font-size:19px;color:var(--accdeep);font-variant-numeric:tabular-nums}
.ring-num span{font-size:11px;color:var(--ink3);margin-top:2px}
.home-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}

/* ================= 备考总览 / 备考计划 专用 ================= */
/* 迷你学习日历 */
.cal-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-hd div{font-size:11.5px;color:var(--ink3);font-weight:700;padding:2px 0}
.cal-day{position:relative;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#faf3e3;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cal-day.today{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:800}
.cal-day i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%}
.cal-day.today i{background:#fff!important}
/* 打卡进度行 */
.ck-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.ck-lab{width:70px;flex:none;font-size:12.5px;font-weight:700;color:var(--ink2)}
.ck-val{width:92px;flex:none;text-align:right;font-size:12px;font-weight:800;color:var(--accdeep);font-variant-numeric:tabular-nums}
/* 模块覆盖行 */
.mod-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.mod-row:last-child{border-bottom:none}
.mod-name{font-size:12.5px;font-weight:700;color:var(--ink)}
.mod-val{flex:none;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
/* 周条 */
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wk-cell{border:1px solid var(--line2);border-radius:11px;padding:9px 8px;text-align:center;background:var(--card2);transition:all .16s;cursor:default}
.wk-cell.today{border-color:var(--acc2);background:var(--accsoft);box-shadow:0 4px 12px rgba(191,95,47,.14)}
.wk-cell .wk-w{font-size:11.5px;font-weight:800;color:var(--ink2)}
.wk-cell .wk-d{font-size:15px;font-weight:900;color:var(--accdeep);margin-top:2px;font-variant-numeric:tabular-nums}
.wk-cell .wk-t{font-size:11px;color:var(--ink3);margin-top:5px;line-height:1.5;min-height:30px}
/* 本周安排（详细任务 + 勾选框） */
.week-strip.wk-detail .wk-cell{padding:9px 7px;min-height:132px;display:flex;flex-direction:column;align-items:center}
.wk-list{width:100%;margin-top:6px;display:flex;flex-direction:column;gap:4px}
.wk-task{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10.5px;color:var(--ink2);line-height:1.35;cursor:pointer;padding:2px 3px;border-radius:6px;transition:background .15s}
.wk-task:hover{background:rgba(191,95,47,.10)}
.wk-task .wk-box{flex:none;width:13px;height:13px;border:1.5px solid var(--line2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:#fff;line-height:1}
.wk-task.done .wk-box{background:var(--green);border-color:var(--green)}
.wk-task .wk-tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left;word-break:break-all}
.wk-task.done .wk-tt{text-decoration:line-through;color:var(--ink3)}
.wk-none{font-size:10.5px;color:var(--ink3)}
.wk-foot{margin-top:auto;padding-top:6px;font-size:10px;color:var(--ink3);width:100%;text-align:center}
/* 每月计划：日期 + 任务数 + 学习时长 */
.cal-day.cal-day-m{height:auto;min-height:52px;flex-direction:column;gap:1px;padding:5px 2px}
.cal-day.cal-day-m .cd-n{font-size:12px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.cal-day.cal-day-m.today .cd-n{color:#fff}
.cal-day.cal-day-m .cd-t{font-size:9.5px;color:var(--ink3)}
.cal-day.cal-day-m.today .cd-t{color:#fff;opacity:.85}
.cal-day.cal-day-m .cd-m{font-size:9.5px;font-weight:800;color:var(--accdeep)}
.cal-day.cal-day-m.today .cd-m{color:#fff}
/* 学习内容与日期行 */

<script>
'use strict';
/* ================= 常量与预设 ================= */
const LS_KEY='shangan_workbench_v1';
const NS='http://www.w3.org/2000/svg';
const WDAY=['一','二','三','四','五','六','日'];
const ROUTES=['home','tasks','study','mock','stats','notes','mind','review','profile'];
const SUBJECTS={
 '行测':['常识判断','言语理解','数量关系','判断推理','资料分析','其他'],
 '申论':['归纳概括','综合分析','提出对策','贯彻执行','文章写作（大作文）','素材积累','其他']
};
const MOD_SHORT={'常识判断':'常识','言语理解':'言语','数量关系':'数量','判断推理':'判断','资料分析':'资料','归纳概括':'归纳','综合分析':'综合','提出对策':'对策','贯彻执行':'贯彻','文章写作（大作文）':'写作','素材积累':'素材','其他':'其他'};
const ERR_TYPES=['知识点不熟','粗心大意','审题不清','方法不当','时间分配','其他'];
const NODES=[['register','报名'],['confirm','资格确认'],['pay','缴费'],['admit','打印准考证'],['exam','笔试']];
/* 学习时长分类：科目（行测/申论/其他）→ 模块二级，模块列表复用 SUBJECTS */
const STUDY_SUBJECTS=['行测','申论','其他'];
const SUBJ_COLORS={'行测':'#3E6FE0','申论':'#2F9E6E','其他':'#9a8f7a'};
function studyModules(subj){return subj==='其他'?['其他']:(SUBJECTS[subj]||['其他'])}
/* 上一轮一级板块到新二级复合键的兼容映射 */
const LEGACY_SECTION_MAP={'行测':'行测/其他','申论':'申论/其他','常识':'行测/常识判断','其他':'其他/其他'};
/* 模块改名映射：旧名自动迁移为新名，历史记录不丢 */
const MODULE_RENAME={'言语理解与表达':'言语理解'};
/* 2027年度考试时间按往年规律预估，可在个人中心修改，以官方公告为准 */
const EXAM_PRESETS=[
 {id:'gk2027',name:'2027年国家公务员考试（国考）',type:'国考',register:'2026-10-15',confirm:'2026-10-26',pay:'2026-11-01',admit:'2026-11-23',exam:'2026-11-29'},
 {id:'lk2027',name:'2027年省考·多省联考',type:'省考',register:'2027-02-15',confirm:'2027-02-24',pay:'2027-02-28',admit:'2027-03-21',exam:'2027-03-28'},
 {id:'js2027',name:'2027年江苏省考',type:'省考',register:'2026-11-10',confirm:'2026-11-14',pay:'2026-11-16',admit:'2026-12-15',exam:'2026-12-19'},
 {id:'sd2027',name:'2027年山东省考',type:'省考',register:'2026-11-08',confirm:'2026-11-12',pay:'2026-11-14',admit:'2026-12-08',exam:'2026-12-13'},
 {id:'zj2027',name:'2027年浙江省考',type:'省考',register:'2026-11-03',confirm:'2026-11-10',pay:'2026-11-12',admit:'2026-12-08',exam:'2026-12-13'},
 {id:'gd2027',name:'2027年广东省考',type:'省考',register:'2027-01-06',confirm:'2027-01-12',pay:'2027-01-15',admit:'2027-03-10',exam:'2027-03-14'},
 {id:'sydw1_2027',name:'2027年事业单位联考（上半年）',type:'事业编',register:'2027-02-22',confirm:'2027-03-01',pay:'2027-03-03',admit:'2027-03-22',exam:'2027-03-27'},
 {id:'sydw2_2027',name:'2027年事业单位联考（下半年）',type:'事业编',register:'2027-09-15',confirm:'2027-09-22',pay:'2027-09-24',admit:'2027-10-25',exam:'2027-10-30'}
];

/* ================= 状态（localStorage） ================= */
function defaultState(){return {settings:{nickname:'',targetExamId:'gk2027',dailyTargetHours:8,dailyTargetTasks:6,goalScore:null},exams:[],tasks:[],study:{},mocks:[],notes:[],reviews:[],mindmaps:[]}}
let state=null;
/* 模块改名后，把历史数据里的旧模块名物理迁移到新名（任务、学习时长） */
function migrateModuleNames(d){
 try{
  (d.tasks||[]).forEach(t=>{if(t&&typeof t.module==='string'&&MODULE_RENAME[t.module])t.module=MODULE_RENAME[t.module]});
  const st=d.study;
  if(st&&typeof st==='object'){
   Object.keys(st).forEach(ds=>{
    const v=st[ds];
    if(v&&typeof v==='object'&&v.byModule&&typeof v.byModule==='object'){
     const bm=v.byModule;
     Object.keys(bm).forEach(k=>{
      const i=k.indexOf('/');if(i<0)return;
      const sub=k.slice(0,i),mod=k.slice(i+1);
      const nm=MODULE_RENAME[mod];
      if(nm&&mod!==nm){
       const nk=sub+'/'+nm;
       bm[nk]=(bm[nk]||0)+bm[k];
       delete bm[k];
      }
     });
    }
   });
  }
 }catch(e){}
}
function loadState(){
 try{
  const raw=localStorage.getItem(LS_KEY);
  if(!raw)return null;
  const d=JSON.parse(raw);
  const before=JSON.stringify(d);
  migrateModuleNames(d);
  const migrated=JSON.stringify(d)!==before;
  const def=defaultState();
  const st={
   ...def,...d,
   settings:{...def.settings,...(d.settings||{})},
   exams:Array.isArray(d.exams)?repairExams(d.exams):[],
   tasks:Array.isArray(d.tasks)?d.tasks.map(t=>({...(t&&typeof t==='object'?t:{}),instances:(t&&t.instances&&typeof t.instances==='object')?t.instances:{},weekdays:Array.isArray(t&&t.weekdays)?t.weekdays:[]})):[],
   study:(d.study&&typeof d.study==='object')?d.study:{},
   mocks:Array.isArray(d.mocks)?d.mocks:[],
   notes:Array.isArray(d.notes)?d.notes:[],
   reviews:Array.isArray(d.reviews)?d.reviews:[]
  };
  if(migrated)st.__migrated=true;
  return st;
 }catch(e){return null}
}
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){toast('数据保存失败：'+e.message,'err')}}

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr=()=>dstr(new Date());
/* 生成本地 datetime-local 输入框默认值（YYYY-MM-DDTHH:MM） */
const nowLocal=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
const parseD=s=>{
 if(typeof s!=='string'||!s)return new Date(NaN);
 const p=s.split('-').map(Number);
 if(p.length<3||p.some(isNaN))return new Date(NaN);
 return new Date(p[0],p[1]-1,p[2]);
};
const wdayOf=s=>{
 const d=parseD(s);
 if(isNaN(d.getTime()))return NaN;
 const w=d.getDay();
 return w===0?7:w;
};
const addDays=(s,n)=>{const d=parseD(s);if(isNaN(d.getTime()))return '';d.setDate(d.getDate()+n);return dstr(d)};
const mondayOf=s=>{const w=wdayOf(s);return isNaN(w)?'':addDays(s,1-w)};
const cnDate=s=>{
 const d=parseD(s);
 if(isNaN(d.getTime()))return '日期无效';
 const mo=d.getMonth()+1,da=d.getDate(),wd=wdayOf(s);
 if(isNaN(mo)||isNaN(da))return '日期无效';
 return mo+'月'+da+'日 周'+(isNaN(wd)?'?':WDAY[wd-1]||'?');
};
function isValidDateStr(s){
 if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
 const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
 const mo=+m[2],da=+m[3];
 if(mo<1||mo>12||da<1||da>31)return false;
 const d=new Date(+m[1],mo-1,da);
 return d.getMonth()===mo-1&&d.getDate()===da;
}
function normalizeDateStr(v){
 if(typeof v!=='string')return '';
 v=v.trim();
 if(isValidDateStr(v))return v;
 let m=/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})日?$/.exec(v);
 if(m){const r=m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);return isValidDateStr(r)?r:'';}
 m=/^(\d{1,2})月(\d{1,2})日?$/.exec(v);
 if(m){const r=new Date().getFullYear()+'-'+pad2(+m[1])+'-'+pad2(+m[2]);return isValidDateStr(r)?r:'';}
 m=/^(\d{1,2})[-/](\d{1,2})$/.exec(v);
 if(m){const r=new Date().getFullYear()+'-'+pad2(+m[1])+'-'+pad2(+m[2]);return isValidDateStr(r)?r:'';}
 return '';
}
function fmtDateCn(s){
 if(!isValidDateStr(s))return '';
 const d=parseD(s);
 if(isNaN(d.getTime()))return '';
 const mo=d.getMonth()+1,da=d.getDate(),wd=wdayOf(s);
 if(isNaN(mo)||isNaN(da))return '';
 return d.getFullYear()+'年'+mo+'月'+da+'日 周'+(isNaN(wd)?'?':WDAY[wd-1]||'?');
}
/* 载入/导入数据时自动修复考试日期：兼容 2026/11/29、2026年11月29日 等格式，无法识别则回退官方预设 */
function repairExams(list){
 if(!Array.isArray(list))return [];
 return list.map(e=>{
  const out={...(e&&typeof e==='object'?e:{})};
  const preset=EXAM_PRESETS.find(p=>p.id===out.id);
  NODES.forEach(([k])=>{
   const v=out[k];

   if(typeof v!=='string'){out[k]='';return;}
   const n=normalizeDateStr(v);
   out[k]=n||(preset?preset[k]:'');
  });

 });
}

function cdText(target,at){
 if(!target)return null;
 const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(target));
 if(!m)return null;
 const mo=+m[2],da=+m[3];
 if(mo<1||mo>12||da<1||da>31)return null;

 if(dd.getMonth()!==mo-1||dd.getDate()!==da)return null;
 const t=dd.getTime()+(at==='09:00'?9*3600e3:0);
 const ms=t-Date.now();
 if(ms<=0)return null;
 const s=Math.floor(ms/1000);
 return {d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60};
}

/* 首页数据聚合：累计作答、正确率、科目覆盖、近7天趋势 */
function homeAgg(){
 const today=todayStr();
 let ans=0,cor=0,tot=0,doneCount=0;
 state.tasks.forEach(t=>{
  for(const ds in (t.instances||{})){
   const it=t.instances[ds];
   if(!it||!it.done)continue;
   doneCount++;
   if(t.target>0){ans+=t.target;if(it.correct!=null){cor+=it.correct;tot+=t.target}}
   else ans+=1;
  }
 });
 const totalMins=Object.keys(state.study).reduce((a,ds)=>a+studyMins(ds),0);
 /* 科目/模块累计学习分钟 */
 const modMap={};
 Object.keys(state.study).forEach(ds=>{
  studyModuleEntries(ds).forEach(e=>{
   const k=e.subject+'/'+e.module;
   modMap[k]=(modMap[k]||0)+e.min;
  });
 });
 /* 各科目累计完成题数 */
 const modAns={};
 state.tasks.forEach(t=>{
  for(const ds in (t.instances||{})){
   if(!t.instances[ds].done)continue;
   const k=t.subject+'/'+t.module;
   modAns[k]=(modAns[k]||0)+(t.target>0?t.target:1);
  }
 });
 return {ans,cor,tot,doneCount,totalMins,modMap,modAns};
}
function homeModuleRows(){
 const agg=homeAgg();
 const keys=Object.keys(agg.modMap).concat(Object.keys(agg.modAns));
 const uniq={};
 keys.forEach(k=>{uniq[k]=(agg.modMap[k]||0)+'|'+(agg.modAns[k]||0)});
 const rows=Object.keys(uniq).map(k=>{
  const [m,a]=uniq[k].split('|');
  return {key:k,min:+m,ans:+a};
 }).sort((x,y)=>y.min-x.min||y.ans-x.ans);
 const max=Math.max(1,...rows.map(r=>r.min));
 return {rows,max};
}

/* 统计某区间内应完成任务总数 */
function countWeekDue(from,to){
 let n=0,d=from,guard=0;
 while(d<=to&&guard<400){
  state.tasks.forEach(t=>{if(dueOn(t,d))n++});
  d=addDays(d,1);guard++;
 }
 return n;
}
function calShift(dir){
 if(dir==='prev'){calMonth--;if(calMonth<0){calMonth=11;calYear--}}
 else{calMonth++;if(calMonth>11){calMonth=0;calYear++}}
}

function dueOn(t,ds){
 if(t.repeat==='weekly')return ds>=t.date&&(t.weekdays||[]).includes(wdayOf(ds));
 return t.date===ds;
}
/* 枚举某任务从开始日期到今天所有应完成的日期（倒序） */
function taskDueDates(t){
 const today=todayStr();
 const dates=[];
 if(t.repeat==='weekly'){
  let d=t.date;
  let guard=0;
  while(d<=today&&guard<400){
   if((t.weekdays||[]).includes(wdayOf(d)))dates.push(d);
   d=addDays(d,1);guard++;
  }
 }else{
  if(t.date<=today)dates.push(t.date);
 }
 return dates.sort((a,b)=>a<b?1:-1);
}
/* 把任务实例按日期分组渲染（倒序，今天在前） */
function groupTaskItems(items,today){
 const groups={};
 items.forEach(({t,ds})=>{(groups[ds]=groups[ds]||[]).push(t)});
 return Object.keys(groups).sort((a,b)=>a<b?1:-1).map(ds=>{
  const label=ds===today?'今天':(ds===addDays(today,-1)?'昨天':cnDate(ds));
  return `<div class="t-meta" style="margin:14px 0 8px;font-weight:700;color:var(--ink2)">${label} · ${groups[ds].length} 项</div>${groups[ds].map(t=>taskRowHTML(t,ds)).join('')}`;
 }).join('');
}
function instDone(t,ds){const it=(t.instances||{})[ds];return !!(it&&it.done)}
function dayStats(ds){
 let due=0,done=0,makeup=0,cor=0,tot=0;
 state.tasks.forEach(t=>{
  if(dueOn(t,ds)){
   due++;
   const it=(t.instances||{})[ds];
   if(it&&it.done){
    /* 完成时间是哪天？计划当天完成才算已完成，否则算补完成 */
    const doneDate=it.at?new Date(it.at).toISOString().slice(0,10):ds;
    if(doneDate===ds){
     done++;
     if(t.target>0&&it.correct!=null){cor+=it.correct;tot+=t.target}
    }else{
     makeup++;
    }
   }
  }
 });
 return {due,done,makeup,rate:pct(done,due),cor,tot};
}
function sumStats(list){let due=0,done=0,makeup=0,cor=0,tot=0;list.forEach(s=>{due+=s.due;done+=s.done;makeup+=s.makeup||0;cor+=s.cor;tot+=s.tot});return {due,done,makeup,rate:pct(done,due),cor,tot}}
function taskChartData(mode){
 const today=todayStr();
 if(mode==='d'){
  const arr=[];
  for(let i=13;i>=0;i--){const ds=addDays(today,-i);arr.push({label:ds.slice(5),s:dayStats(ds)})}
  return arr;
 }
 if(mode==='w'){
  const arr=[];
  for(let i=7;i>=0;i--){
   const mon=mondayOf(addDays(today,-7*i));
   const days=[];
   for(let j=0;j<7;j++){const ds=addDays(mon,j);if(ds>today)break;days.push(dayStats(ds))}
   arr.push({label:mon.slice(5)+'周',s:sumStats(days)});
  }
  return arr;
 }
 const now=new Date(),arr=[];
 for(let i=5;i>=0;i--){
  const y=now.getFullYear(),mm=now.getMonth()-i;
  const first=new Date(y,mm,1);
  const lastDay=new Date(y,mm+1,0);
  const days=[];
  for(let d=first;d<=lastDay&&dstr(d)<=today;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))days.push(dayStats(dstr(d)));
  const s=sumStats(days);
  /* 只显示有数据的月份（应完成>0 或 已完成>0 或 补完成>0） */
  if(s.due>0||s.done>0||s.makeup>0)arr.push({label:first.getFullYear()+'-'+pad2(first.getMonth()+1),s});
 }
 return arr;
}
function taskRowHTML(t,ds,all){
 const done=instDone(t,ds);
 const it=(t.instances||{})[ds];
 const rate=done&&t.target>0&&it.correct!=null?pct(it.correct,t.target):null;
 const today=todayStr();
 const rep=t.repeat==='weekly'?`每周 · ${(t.weekdays||[]).map(w=>'周'+WDAY[w-1]).join('、')}`:(ds===today?'仅今天':'日期 '+t.date);
 /* 补完成：完成时间是今天，但计划日期是过去 */
 const doneDate=it&&it.at?new Date(it.at).toISOString().slice(0,10):ds;
 const isMakeup=done&&ds<doneDate;
 const makeupTag=isMakeup?`<span class="tag" style="background:#f4e4c1;color:#a66c00">补做 ${cnDate(doneDate)}</span>`:'';
 const dayTag=ds!==today?(ds===addDays(today,-1)?'<span class="tag tag-gray">昨天</span>':`<span class="tag tag-gray">${cnDate(ds)}</span>`):'';
 const statusChip=all?(!dueOn(t,ds)?`<span class="tag tag-gray">非今日</span>`:done?`<span class="tag tag-green">今日已完成</span>`:`<span class="tag tag-red">今日待完成</span>`):'';
 return `<div class="t-item ${done?'done':''}">
  <span class="tag ${t.subject==='行测'?'tag-xc':'tag-sl'}">${esc(t.subject)}</span>
  <div class="t-info"><div class="t-title">${esc(t.title)}</div><div class="t-meta"><span>${esc(t.module)}</span>${t.target?`<span>目标 ${t.target} 题</span>`:''}<span>${rep}</span>${dayTag}${makeupTag}${statusChip}</div></div>
  <div class="t-right">
   ${done?(rate!=null?`<span class="rate-badge">正确率 ${rate}%</span>`:'')+`<button class="btn sm btn-ghost" data-act="undo" data-id="${t.id}" data-ds="${ds}">撤销</button>`:`<button class="btn sm" data-act="complete" data-id="${t.id}" data-ds="${ds}">完成</button>`}
   <button class="btn sm btn-ghost" data-act="edit" data-id="${t.id}">编辑</button>
   <button class="btn sm btn-danger" data-act="del" data-id="${t.id}">删除</button>
  </div></div>`;
}

/* 解析番茄ToDo等专注记录的粘贴文本：每行一条，如 "10月28日 90分钟" / "2026-10-28 1小时30分" */
function parseFocusText(text,fallbackDate){
 const rows=[];
 if(typeof fallbackDate!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(fallbackDate))fallbackDate=todayStr();
 const year=parseInt(fallbackDate.slice(0,4),10);
 String(text||'').split(/\n+/).forEach(line=>{
  line=line.replace(/[，,;；]\s*$/,'').trim();
  if(!line)return;
  let ds=null;
  const m1=line.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})日?/);
  const m2=line.match(/(\d{1,2})月(\d{1,2})日?/);
  const m3=line.match(/(\d{1,2})[-\/](\d{1,2})(?!\d)/);
  if(m1)ds=m1[1]+'-'+pad2(+m1[2])+'-'+pad2(+m1[3]);
  else if(m2)ds=year+'-'+pad2(+m2[1])+'-'+pad2(+m2[2]);
  else if(m3)ds=year+'-'+pad2(+m3[1])+'-'+pad2(+m3[2]);
  if(!ds)ds=fallbackDate;
  if(isNaN(parseD(ds).getTime()))return;
  let min=0;
  const hm=line.match(/(\d+(?:\.\d+)?)\s*(?:小时|时|h|H)/);
  const mm=line.match(/(\d+(?:\.\d+)?)\s*(?:分钟|分|min|m)(?!\s*(?:小时|时|h|H))/);
  if(hm)min+=parseFloat(hm[1])*60;
  if(mm)min+=parseFloat(mm[1]);
  if(min===0){
   const dm=m1||m2||m3;
   let after=dm?line.slice(dm.index+dm[0].length):line;
   const nn=after.match(/(\d+(?:\.\d+)?)/);
   if(nn)min=Math.round(parseFloat(nn[1]));
  }
  min=Math.round(min);
  if(min>0&&min<=1440)rows.push({date:ds,min,raw:line});
 });
 return rows;
}

/* 学习时长数据：新结构 {total, byModule:{'科目/模块':分钟}}；兼容纯数字旧结构与上一轮 bySection 一级结构 */
function studyMins(ds){
 const v=state.study[ds];
 if(v==null)return 0;
 if(typeof v==='number')return v;
 if(typeof v==='object'&&v)return v.total||0;
 return 0;
}
/* 解析某天的科目/模块明细，兼容三种历史格式 */
function studyModuleEntries(ds){
 const v=state.study[ds];
 if(v==null)return [];
 if(typeof v==='number')return v>0?[{subject:'其他',module:'其他',min:v}]:[];
 if(typeof v==='object'&&v){
  if(v.byModule){
   return Object.entries(v.byModule).map(([key,min])=>{
    const i=key.indexOf('/');
    const subject=i>0?key.slice(0,i):'其他';
    const rawMod=i>0?key.slice(i+1):'其他';
    const module=MODULE_RENAME[rawMod]||rawMod;
    return {subject,module,min};
   });
  }
  if(v.bySection){
   return Object.entries(v.bySection).map(([sec,min])=>{
    const k=LEGACY_SECTION_MAP[sec]||'其他/其他';const i=k.indexOf('/');
    return {subject:k.slice(0,i),module:k.slice(i+1),min};
   });
  }
 }
 return [];
}
/* 按科目汇总 {科目:分钟} */
function studySubjectAgg(){
 const agg={};
 Object.keys(state.study).forEach(ds=>studyModuleEntries(ds).forEach(e=>{agg[e.subject]=(agg[e.subject]||0)+e.min}));
 return agg;
}
/* 按科目+模块汇总，返回按科目、模块顺序排序的数组 */
function studyModuleAgg(){
 const map={};
 Object.keys(state.study).forEach(ds=>studyModuleEntries(ds).forEach(e=>{
  const key=e.subject+'/'+e.module;
  if(!map[key])map[key]={subject:e.subject,module:e.module,min:0};
  map[key].min+=e.min;
 }));
 return Object.values(map).filter(x=>x.min>0).sort((a,b)=>{
  const so=(a.subject==='行测'?0:a.subject==='申论'?1:2)-(b.subject==='行测'?0:b.subject==='申论'?1:2);
  if(so)return so;
  const ma=(SUBJECTS[a.subject]||['其他']).indexOf(a.module),mb=(SUBJECTS[b.subject]||['其他']).indexOf(b.module);
  return ma-mb;
 });
}
/* 统一写入某天某科目某模块学习分钟，自动迁移旧结构 */
function addStudyMin(ds,min,subject,module,note){
 subject=subject||'其他';module=module||'其他';
 let base;const old=state.study[ds];
 if(typeof old==='number')base={total:old,byModule:{'其他/其他':old}};
 else if(old&&typeof old==='object'){
  let byModule={};
  if(old.byModule)byModule={...old.byModule};
  else if(old.bySection)Object.entries(old.bySection).forEach(([sec,m])=>{const k=LEGACY_SECTION_MAP[sec]||'其他/其他';byModule[k]=(byModule[k]||0)+m});
  base={total:old.total||0,byModule,note:old.note||''};
 }else base={total:0,byModule:{},note:''};
 base.total+=min;
 const key=subject+'/'+module;
 base.byModule[key]=(base.byModule[key]||0)+min;
 if(note)base.note=note;
 state.study[ds]=base;
}
/* 撤销完成时扣回自动计入的学习时长 */
function removeStudyMin(ds,min,subject,module){
 if(!min||min<=0)return;
 const old=state.study[ds];
 if(old==null)return;
 let base;
 if(typeof old==='number')base={total:old,byModule:{'其他/其他':old}};
 else if(old.byModule)base={total:old.total||0,byModule:{...old.byModule},note:old.note||''};
 else return;
 base.total=Math.max(0,(base.total||0)-min);
 const key=(subject||'其他')+'/'+(module||'其他');
 if(base.byModule[key]!=null)base.byModule[key]=Math.max(0,base.byModule[key]-min);
 state.study[ds]=base;
}
function rangeMins(from,to){let s=0;for(let ds=from;ds<=to;ds=addDays(ds,1))s+=studyMins(ds);return s}
/* 撤销某天的完成：同时回退当天自动计入的学习时长，保证数据同步 */
function undoTaskInst(t,ds){
 const it=t.instances&&t.instances[ds];
 if(!it)return;
 const day=it.at?new Date(it.at).toISOString().slice(0,10):ds;
 if(it.studyMin>0)removeStudyMin(day,it.studyMin,t.subject,t.module);
 delete t.instances[ds];
}

  }
  return arr;
 }
 const now=new Date(),arr=[];
 for(let i=5;i>=0;i--){
  const y=now.getFullYear(),mm=now.getMonth()-i;
  const first=new Date(y,mm,1);
  const last=new Date(y,mm+1,0);/* 当月最后一天，必须在此处收口，否则会一直累加到今天 */
  const firstDs=dstr(first),lastDs=dstr(last);

  arr.push({label:first.getFullYear()+'-'+pad2(first.getMonth()+1),v:s});
 }
 return arr;
}

/* ================= 思维导图模块 ================= */
let mmEditing=false,mmCurId=null,mmSel=null,mmZoom=1,mmPan={x:0,y:0};
const MM_COLORS=['#3E6FE0','#2F9E6E','#8B5CF6','#D97706','#0E9AA7'];
function mmEnsureData(){
 if(!Array.isArray(state.mindmaps))state.mindmaps=[];
 state.mindmaps.forEach(m=>{
  if(!m.id)m.id=uid();
  if(!m.title)m.title='未命名导图';
  if(!m.updatedAt)m.updatedAt=Date.now();
  if(!m.root||typeof m.root!=='object')m.root={id:uid(),text:m.title,children:[],collapsed:false};
  mmFixNode(m.root);
 });
}
function mmFixNode(n){
 if(!n.id)n.id=uid();
 if(typeof n.text!=='string')n.text=String(n.text==null?'':n.text);
 if(!Array.isArray(n.children))n.children=[];
 n.children.forEach(mmFixNode);
 if(n.collapsed===undefined)n.collapsed=false;
 return n;
}
function mmCur(){(state.mindmaps||[]).forEach(()=>{});return (state.mindmaps||[]).find(m=>m.id===mmCurId)||null}
function mmFind(root,id){let r=null;(function w(n){if(r)return;if(n.id===id){r=n;return}n.children.forEach(w)})(root);return r}
function mmParent(root,id){let p=null;(function w(n){if(p)return;n.children.forEach(c=>{if(c.id===id){p=n;return}w(c)})})(root);return p}
function mmCount(n){return 1+(n.children||[]).reduce((a,c)=>a+mmCount(c),0)}
function mmTime(ts){const d=new Date(ts||0);return pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())}
let _mmCtx=null;
function mmCtx(){if(!_mmCtx){_mmCtx=document.createElement('canvas').getContext('2d')}return _mmCtx}
function mmFont(T,isRoot){T.font=(isRoot?'900 15px ':'700 13.5px ')+'-apple-system,"PingFang SC","Microsoft YaHei",sans-serif'}
function mmEllip(T,text,maxW){
 if(T.measureText(text).width<=maxW)return text;
 let t=text;
 while(t.length>1&&T.measureText(t+'…').width>maxW)t=t.slice(0,-1);
 return t+'…';
}
function mmMeasure(n,T,isRoot){
 mmFont(T,isRoot);
 const tw=T.measureText(n.text).width;
 n.w=Math.round(Math.max(66,Math.min(236,tw+30)));
 n.h=isRoot?40:34;
 if(!n.collapsed&&n.children.length){
  let h=0;
  n.children.forEach(c=>{mmMeasure(c,T,false);h+=c.sh});
  h+=(n.children.length-1)*16;
  n.sh=Math.max(n.h,h);
  return n.sh;
 }
 n.sh=n.h;
 return n.sh;
}
function mmPlace(n,x,y){
 n.x=x;n.y=y+(n.sh-n.h)/2;
 if(n.collapsed||!n.children.length)return;
 let cy=y;
 n.children.forEach(c=>{mmPlace(c,x+n.w+58,cy);cy+=c.sh+16});
}
function mmPrepare(map){
 const T=mmCtx();
 mmMeasure(map.root,T,true);
 mmPlace(map.root,46,46);
 let w=0,h=0;
 (function walk(n){
  w=Math.max(w,n.x+n.w+((n.collapsed&&n.children.length)?26:0));
  h=Math.max(h,n.y+n.h);
  if(!n.collapsed)n.children.forEach(walk);
 })(map.root);
 return {w,h};
}
function mmDraw(){
 const cv=$('#mm-canvas');if(!cv)return;
 const map=mmCur();if(!map)return;
 const b=mmPrepare(map);
 const W=Math.max(200,cv.clientWidth),H=Math.max(200,cv.clientHeight);
 const T=mmCtx();
 let links='',nodes='';
 const stack=[[map.root,0,0]];
 while(stack.length){
  const [n,dep,ci]=stack.pop();
  const col=dep===0?'#bf5f2f':(dep===1?MM_COLORS[ci%MM_COLORS.length]:'#8a7452');
  const fill=dep<=1?col:'#fdf9f0';
  const tcol=dep<=1?'#fff':'#4a4133';
  T.font=(dep===0?'900 15px ':'700 13.5px ')+'-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  const txt=mmEllip(T,n.text,n.w-22);
  const sel=mmSel===n.id;
  nodes+=`<g data-nid="${n.id}" style="cursor:pointer">
   <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${dep===0?12:9}" fill="${fill}" ${dep>1?'stroke="'+MM_COLORS[ci%MM_COLORS.length]+'" stroke-width="1.5"':''} ${sel?'stroke="#7d3a18" stroke-width="2.5"':''}/>
   <text x="${n.x+n.w/2}" y="${n.y+n.h/2+5}" text-anchor="middle" fill="${tcol}" font-size="${dep===0?15:13.5}" font-weight="${dep===0?900:700}">${esc(txt)}</text>
   ${(n.collapsed&&n.children.length)?`<circle cx="${n.x+n.w+9}" cy="${n.y+n.h/2}" r="9.5" fill="#fff" stroke="${col}" stroke-width="1.5"/><text x="${n.x+n.w+9}" y="${n.y+n.h/2+3.5}" text-anchor="middle" fill="${col}" font-size="10" font-weight="800">${n.children.length}</text>`:''}
  </g>`;
  if(!n.collapsed)n.children.forEach((c,i)=>{
   const x1=n.x+n.w,y1=n.y+n.h/2,x2=c.x,y2=c.y+c.h/2;
   links+=`<path d="M${x1} ${y1} C${x1+30} ${y1}, ${x2-30} ${y2}, ${x2} ${y2}" fill="none" stroke="${dep===0?MM_COLORS[i%MM_COLORS.length]:'#c9a97c'}" stroke-opacity="${dep===0?.7:.5}" stroke-width="2"/>`;
   stack.push([c,dep+1,i]);
  });
 }
 cv.innerHTML=`<svg xmlns="${NS}" viewBox="0 0 ${W} ${H}" width="100%" height="100%"><g transform="translate(${Math.round(mmPan.x)},${Math.round(mmPan.y)}) scale(${mmZoom})">${links}${nodes}</g></svg>`;
 const zl=$('#mm-zoom-label');if(zl)zl.textContent=Math.round(mmZoom*100)+'%';
}
function mmFit(){
 const cv=$('#mm-canvas');if(!cv)return;
 const map=mmCur();if(!map)return;
 const b=mmPrepare(map);
 const W=Math.max(200,cv.clientWidth),H=Math.max(200,cv.clientHeight);
 const z=Math.max(.4,Math.min(1.15,Math.min((W-56)/Math.max(1,b.w),(H-56)/Math.max(1,b.h))));
 mmZoom=z;
 mmPan={x:(W-b.w*z)/2,y:(H-b.h*z)/2};
 mmDraw();
}
function mmCommit(map){
 map.updatedAt=Date.now();
 persist();
 mmDraw();
 const sub=$('#view-mind .v-sub');
 if(sub)sub.textContent=`${map.title} · 共 ${mmCount(map.root)} 个节点`;
 const ttl=$('#view-mind .mm-title-in');
 if(ttl&&document.activeElement!==ttl)ttl.value=map.title;
}
function mmCurNode(){const map=mmCur();if(!map)return null;return mmFind(map.root,mmSel)||map.root}
function mmOpen(id){
 mmEditing=true;mmCurId=id;
 const map=mmCur();
 mmSel=map?map.root.id:null;
 mmZoom=1;mmPan={x:0,y:0};
 renderCurrent();
 setTimeout(mmFit,40);
}
function mmTextModal(node){
 openModal({title:'编辑节点文字',body:`<div class="f-row"><label>文字内容</label><input id="mm-tx" maxlength="40" value="${esc(node.text)}" placeholder="如：判断推理"></div><div class="m-actions"><button class="btn btn-ghost" data-close>取消</button><button class="btn" data-ok>确定</button></div>`,
 onOpen:(card,close)=>{
  const inp=card.querySelector('#mm-tx');
  const ok=()=>{
   const val=inp.value.trim();

function mmNewModal(){
 openModal({title:'新建思维导图',body:`<div class="f-row"><label>中心主题</label><input id="mm-name" maxlength="30" placeholder="如：判断推理 知识框架"></div><div class="m-actions"><button class="btn btn-ghost" data-close>取消</button><button class="btn" data-ok>创建并编辑</button></div>`,
 onOpen:(card,close)=>{
  const inp=card.querySelector('#mm-name');

   const name=inp.value.trim();
   if(!name){toast('请填写中心主题','err');return}

function mmRenameModal(m){
 openModal({title:'重命名思维导图',body:`<div class="f-row"><label>名称</label><input id="mm-rn" maxlength="30" value="${esc(m.title)}"></div><div class="m-actions"><button class="btn btn-ghost" data-close>取消</button><button class="btn" data-ok>保存</button></div>`,
 onOpen:(card,close)=>{
  const inp=card.querySelector('#mm-rn');

  inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok()});
  setTimeout(()=>{inp.focus();inp.select()},60);

function mmDeleteNode(){
 const map=mmCur();if(!map)return;
 const n=mmCurNode();
 if(!n||n.id===map.root.id){toast('中心主题不能删除','err');return}
 const p=mmParent(map.root,n.id);
 if(!p)return;
 p.children=p.children.filter(c=>c.id!==n.id);
 mmSel=p.id;
 mmCommit(map);
 toast('已删除节点');
}
function renderMind(){
 mmEnsureData();
 const v=$('#view-mind');
 const map=mmCur();
 if(mmEditing&&map)mmEditor(v,map);else mmList(v);
}

 v.innerHTML=`${head('思维导图','把知识拆成树状结构，梳理章节框架、题型思路与素材脉络',`<button class="btn" id="mm-new">+ 新建思维导图</button>`)}
 <div class="card"><div class="mm-grid" id="mm-list"></div></div>`;

function mmEditor(v,map){
 v.innerHTML=`${head('思维导图',`${map.title} · 共 ${mmCount(map.root)} 个节点`,`<button class="btn btn-ghost" id="mm-back">‹ 列表</button> <button class="btn" id="mm-save">保存</button>`)}
 <div class="card">
  <div class="mm-bar">

 </div>`;
 $('#mm-back').onclick=()=>{mmEditing=false;mmSel=null;renderCurrent()};

 $('#mm-title').addEventListener('input',e=>{
  const t=e.target.value.trim();

 });
 v.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.mm;
  const node=mmCurNode();
  if(a==='child'){
   if(!node)return;
   const n={id:uid(),text:'新分支',children:[],collapsed:false};
   node.collapsed=false;node.children.push(n);
   mmSel=n.id;mmCommit(map);mmTextModal(n);return;
  }
  if(a==='sibling'){
   if(!node)return;
   const p=mmParent(map.root,node.id);
   if(!p){toast('中心主题没有同级节点','err');return}
   const idx=p.children.indexOf(node);
   const n={id:uid(),text:'新分支',children:[],collapsed:false};
   p.children.splice(idx+1,0,n);
   mmSel=n.id;mmCommit(map);mmTextModal(n);return;
  }
  if(a==='edit'){if(node)mmTextModal(node);return}
  if(a==='fold'){
   if(!node)return;
   if(!node.children.length){toast('该节点还没有子节点','err');return}
   node.collapsed=!node.collapsed;
   mmCommit(map);return;
  }
  if(a==='del'){mmDeleteNode();return}
  if(a==='fit'){mmFit();return}
  if(a==='zin'||a==='zout'){
   const cv=$('#mm-canvas');if(!cv)return;
   const W=cv.clientWidth/2,H=cv.clientHeight/2;
   const wx=(W-mmPan.x)/mmZoom,wy=(H-mmPan.y)/mmZoom;
   const nz=Math.max(.4,Math.min(2,mmZoom*(a==='zin'?1.15:1/1.15)));
   mmPan.x=W-wx*nz;mmPan.y=H-wy*nz;mmZoom=nz;mmDraw();return;
  }
  if(a==='reset'){mmZoom=1;mmPan={x:0,y:0};mmFit();return}
 });
 const cv=$('#mm-canvas');
 cv.addEventListener('click',e=>{
  const g=e.target.closest('[data-nid]');
  if(!g){if(mmSel!==map.root.id){mmSel=map.root.id;mmDraw()}return}
  mmSel=g.dataset.nid;mmDraw();
 });
 cv.addEventListener('dblclick',e=>{
  const g=e.target.closest('[data-nid]');
  if(!g)return;
  const n=mmFind(map.root,g.dataset.nid);
  if(!n)return;
  mmSel=n.id;mmDraw();mmTextModal(n);
 });
 let drag=null;
 cv.addEventListener('pointerdown',e=>{
  if(e.target.closest('[data-nid]'))return;
  drag={x:e.clientX,y:e.clientY,px:mmPan.x,py:mmPan.y};
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
 });
 cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  mmPan.x=drag.px+(e.clientX-drag.x);
  mmPan.y=drag.py+(e.clientY-drag.y);
  mmDraw();
 });
 const endDrag=()=>{drag=null};
 cv.addEventListener('pointerup',endDrag);
 cv.addEventListener('pointercancel',endDrag);
 cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const wx=(mx-mmPan.x)/mmZoom,wy=(my-mmPan.y)/mmZoom;
  const nz=Math.max(.4,Math.min(2,mmZoom*(e.deltaY<0?1.1:1/1.1)));
  mmPan.x=mx-wx*nz;mmPan.y=my-wy*nz;mmZoom=nz;mmDraw();
 },{passive:false});
 cv.addEventListener('contextmenu',e=>e.preventDefault());
 mmDraw();
 setTimeout(mmFit,30);
}
let mmKeyBound=false;
function mmBindKeys(){
 if(mmKeyBound)return;mmKeyBound=true;
 document.addEventListener('keydown',e=>{
  if(current!=='mind'||!mmEditing)return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();mmDeleteNode()}
 });
}
mmBindKeys();

/* ================= 复盘模块 ================= */
let revSub='all',revSt='all';
function reviewModal(r){
 const isEdit=!!r;
 const d=r||{date:todayStr(),subject:'行测',module:SUBJECTS['行测'][0],source:'',type:ERR_TYPES[0],reason:'',improve:''};
 openModal({title:isEdit?'编辑复盘':'新增复盘',wide:true,body:`
  <div class="f-grid2">
   <div class="f-row"><label>日期</label><input type="date" id="rv-date" value="${d.date}"></div>
   <div class="f-row"><label>错误类型</label><select id="rv-type">${ERR_TYPES.map(t=>`<option ${t===d.type?'selected':''}>${t}</option>`).join('')}</select></div>
   <div class="f-row"><label>科目</label><select id="rv-subject"><option value="行测" ${d.subject==='行测'?'selected':''}>行测</option><option value="申论" ${d.subject==='申论'?'selected':''}>申论</option></select></div>
   <div class="f-row"><label>模块</label><select id="rv-module"></select></div>
  </div>
  <div class="f-row"><label>题目来源（可选）</label><input id="rv-source" value="${esc(d.source)}" placeholder="如：2025国考真题 第78题"></div>
  <div class="f-row"><label>错因分析</label><textarea id="rv-reason" rows="3" placeholder="为什么会错？是知识点漏洞、粗心还是方法问题？">${esc(d.reason)}</textarea></div>
  <div class="f-row"><label>改进措施</label><textarea id="rv-improve" rows="3" placeholder="下次如何避免？针对性训练计划？">${esc(d.improve)}</textarea></div>
  <div class="m-actions"><button class="btn btn-ghost" data-close>取消</button><button class="btn" data-ok>保存</button></div>`,
 onOpen:(card,close)=>{
  const subSel=card.querySelector('#rv-subject'),modSel=card.querySelector('#rv-module');
  const fill=()=>{
   const cur=modSel.value;
   modSel.innerHTML=SUBJECTS[subSel.value].map(m=>`<option>${m}</option>`).join('');
   if(SUBJECTS[subSel.value].includes(cur))modSel.value=cur;
  };
  fill();subSel.onchange=fill;
  card.querySelector('[data-ok]').onclick=()=>{
   const reason=card.querySelector('#rv-reason').value.trim();
   if(!reason){toast('请填写错因分析','err');return}
   const obj={id:isEdit?r.id:uid(),date:card.querySelector('#rv-date').value||todayStr(),subject:subSel.value,module:modSel.value,source:card.querySelector('#rv-source').value.trim(),type:card.querySelector('#rv-type').value,reason,improve:card.querySelector('#rv-improve').value.trim(),status:isEdit?r.status:'待改进',createdAt:isEdit?r.createdAt:Date.now(),updatedAt:Date.now()};
   if(isEdit){const i=state.reviews.findIndex(x=>x.id===r.id);state.reviews[i]=obj}
   else state.reviews.push(obj);
   refresh();close();toast('复盘已保存 ✓');
  };
 }});
}
function renderReview(){
 const v=$('#view-review');
 const total=state.reviews.length;
 const improved=state.reviews.filter(r=>r.status==='已改进').length;
 const pend=total-improved;
 const typeCount={};
 ERR_TYPES.forEach(t=>typeCount[t]=0);
 state.reviews.forEach(r=>{if(typeCount[r.type]!=null)typeCount[r.type]++});
 const typeRows=ERR_TYPES.filter(t=>typeCount[t]>0).map((t,i)=>({label:t,value:typeCount[t],text:`${typeCount[t]} 次`,color:['#c24f3a','#c9992f','#4a7a9b','#5f8b4b','#bf5f2f','#a08d6f'][i]}));
 v.innerHTML=`${head('复盘','记录错误 · 分析原因 · 持续改进')}
 <div class="stat-grid">
  ${statCard('复盘总数',total,'🔁')+statCard('待改进',pend,'⏳')+statCard('已改进',improved,'✅')+statCard('改进率',total?pct(improved,total)+'%':'—','📈')}
 </div>
 <div class="card"><div class="card-h"><h3><span class="dot"></span>错误类型分布</h3></div><div id="rev-types"></div></div>
 <div class="card">
  <div class="card-h">
   <div class="chip-row"><span class="chip ${revSub==='all'?'on':''}" data-rs="all">全部科目</span><span class="chip ${revSub==='行测'?'on':''}" data-rs="行测">行测</span><span class="chip ${revSub==='申论'?'on':''}" data-rs="申论">申论</span><span class="chip ${revSt==='all'?'on':''}" data-rt="all">全部状态</span><span class="chip ${revSt==='待改进'?'on':''}" data-rt="待改进">待改进</span><span class="chip ${revSt==='已改进'?'on':''}" data-rt="已改进">已改进</span></div>
   <button class="btn" id="rev-add">+ 新增复盘</button>
  </div>
  <div id="rev-list"></div>
 </div>`;
 hbarList($('#rev-types'),typeRows);
 $('#rev-add').onclick=()=>reviewModal(null);
 v.querySelectorAll('[data-rs]').forEach(c=>c.onclick=()=>{revSub=c.dataset.rs;renderReview()});
 v.querySelectorAll('[data-rt]').forEach(c=>c.onclick=()=>{revSt=c.dataset.rt;renderReview()});
 const list=state.reviews.filter(r=>(revSub==='all'||r.subject===revSub)&&(revSt==='all'||r.status===revSt)).sort((a,b)=>a.date>b.date?-1:1);
 $('#rev-list').innerHTML=list.length?list.map(r=>`<div class="rev-card">
  <div class="rev-head"><span class="tag tag-gray">${r.date}</span><span class="tag ${r.subject==='行测'?'tag-xc':'tag-sl'}">${esc(r.subject)}</span><span class="tag tag-gold">${esc(r.module)}</span><span class="tag tag-red">${esc(r.type)}</span><span class="tag ${r.status==='已改进'?'tag-green':'tag-gray'}">${r.status}</span></div>
  <div class="rev-body">${r.source?`<div><b>题目来源：</b>${esc(r.source)}</div>`:''}<div><b>错因分析：</b>${esc(r.reason)}</div>${r.improve?`<div><b>改进措施：</b>${esc(r.improve)}</div>`:''}</div>
  <div class="rev-actions"><button class="btn sm ${r.status==='已改进'?'btn-ghost':'green'}" data-act="tog" data-id="${r.id}">${r.status==='已改进'?'↩ 重新打开':'✅ 标记已改进'}</button><button class="btn sm btn-ghost" data-act="edit" data-id="${r.id}">编辑</button><button class="btn sm btn-danger" data-act="del" data-id="${r.id}">删除</button></div>
 </div>`).join(''):`<div class="empty"><span class="e-ic">🔁</span>还没有复盘记录<br>刷题后把错题记录下来，持续改进</div>`;
 $('#rev-list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const r=state.reviews.find(x=>x.id===b.dataset.id);
  if(!r)return;
  if(b.dataset.act==='tog'){r.status=r.status==='已改进'?'待改进':'已改进';r.updatedAt=Date.now();refresh();toast(r.status==='已改进'?'已标记改进，继续保持 💪':'已重新打开')}
  if(b.dataset.act==='edit')reviewModal(r);
  if(b.dataset.act==='del')confirmBox({title:'删除复盘',text:'确定删除这条复盘记录吗？',danger:true,okText:'删除',onOk:()=>{state.reviews=state.reviews.filter(x=>x.id!==b.dataset.id);refresh();toast('已删除')}});
 });
}

function exportData(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='上岸数据备份-'+todayStr()+'.json';
 document.body.appendChild(a);
 a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},300);
 toast('备份已导出 ✓');
}
function importData(file){
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!d||typeof d!=='object'||!Array.isArray(d.tasks))throw new Error('bad');
   const def=defaultState();
   state={...def,...d,settings:{...def.settings,...(d.settings||{})},exams:Array.isArray(d.exams)?repairExams(d.exams):[],tasks:d.tasks.map(t=>({...(t&&typeof t==='object'?t:{}),instances:(t&&t.instances&&typeof t.instances==='object')?t.instances:{},weekdays:Array.isArray(t&&t.weekdays)?t.weekdays:[]})),study:(d.study&&typeof d.study==='object')?d.study:{},mocks:Array.isArray(d.mocks)?d.mocks:[],notes:Array.isArray(d.notes)?d.notes:[],reviews:Array.isArray(d.reviews)?d.reviews:[],mindmaps:Array.isArray(d.mindmaps)?d.mindmaps:[]};
   refresh();toast('数据导入成功 ✓');
  }catch(e){toast('导入失败：文件格式不正确','err')}
 };
 r.readAsText(file);
}

}

/* ================= 初始化 ================= */
function init(){
 /* 先注册秒表与恢复刷新，任何后续异常都不影响倒计时走动 */
 setInterval(tick,1000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
 window.addEventListener('focus',tick);
 state=loadState();
 if(!state){
  state=defaultState();
  state.exams=EXAM_PRESETS.map(e=>({...e}));
  persist();
 }else if(state.__migrated){
  /* 模块改名迁移已发生，立即把新名写回本地 */
  delete state.__migrated;
  persist();
 }
 $$('.nav-item').forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));
 const r=(location.hash||'#/home').slice(2);
 try{go(ROUTES.includes(r)?r:'home')}catch(e){console.error('init error:',e);toast('初始化出错：'+e.message,'err')}
}
window.addEventListener('DOMContentLoaded',()=>{
 init();
 setTimeout(()=>{
  const l=$('#loader');
  if(l){l.classList.add('done');setTimeout(()=>l.remove(),800)}
 },2300);
});
</script>
