<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#bf5f2f">
<title>上岸 · 考公备考工作台</title>
<!-- PWA 配置 -->
<link rel="manifest" href="manifest.json">
<!-- iOS Safari 支持 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="上岸">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23bf5f2f'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>岸</text></svg>">
<!-- Android Chrome 支持 -->
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23bf5f2f'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>岸</text></svg>">
<style>
/* ================= 基础 ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg:#f6efe1;--card:#fffaf1;--card2:#fdf6e8;
 --line:#e9dcc0;--line2:#efe3cc;
 --ink:#4a3a26;--ink2:#7a6a50;--ink3:#a5926f;
 --acc:#bf5f2f;--acc2:#d98a4b;--accsoft:#f7e2cf;--accdeep:#9c4a22;
 --green:#5f8b4b;--greensoft:#e6efdc;
 --blue:#4a7a9b;--bluesoft:#e2ecf3;
 --red:#c24f3a;--redsoft:#f6e0da;
 --gold:#c9992f;--goldsoft:#f6ecd4;
 --sh:0 8px 24px rgba(122,92,56,.10);
}
html,body{height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Segoe UI",sans-serif;background:
 radial-gradient(1100px 520px at 88% -10%, rgba(217,138,75,.14), transparent 60%),
 radial-gradient(900px 520px at -12% 108%, rgba(201,153,47,.12), transparent 60%),
 var(--bg);color:var(--ink);overflow:hidden}
::selection{background:rgba(191,95,47,.22)}
button{font-family:inherit}
.main::-webkit-scrollbar,.m-card::-webkit-scrollbar{width:9px;height:9px}
.main::-webkit-scrollbar-thumb,.m-card::-webkit-scrollbar-thumb{background:#e0d0ae;border-radius:99px}
.main::-webkit-scrollbar-track,.m-card::-webkit-scrollbar-track{background:transparent}

/* ================= 加载动画 ================= */
#loader{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#faf1dd 0%,#f5e6c9 55%,#eed8b4 100%);transition:opacity .7s ease,visibility .7s}
#loader.done{opacity:0;visibility:hidden;pointer-events:none}
.ld{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;z-index:2}
.ld-chars{display:flex;gap:16px;animation:bob 3.4s ease-in-out 1.9s infinite}
.char{font-size:96px;font-weight:900;letter-spacing:4px;color:var(--accdeep);opacity:0;filter:blur(20px);transform:translateY(54px) scale(1.4);clip-path:inset(100% 0 0 0);animation:charIn 1.05s cubic-bezier(.22,.9,.28,1) forwards;text-shadow:0 6px 26px rgba(191,95,47,.28)}
.char:nth-child(2){animation-delay:.45s}
@keyframes charIn{0%{opacity:0;filter:blur(20px);transform:translateY(54px) scale(1.4);clip-path:inset(100% 0 0 0)}55%{opacity:1;filter:blur(3px);transform:translateY(-6px) scale(.97);clip-path:inset(0 0 0 0)}75%{filter:blur(0);transform:translateY(4px) scale(1.02)}100%{opacity:1;filter:blur(0);transform:none;clip-path:inset(0 0 0 0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ld-wave{width:0;height:4px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--acc2),transparent);animation:waveGrow .9s ease-out .9s forwards;box-shadow:0 0 18px rgba(217,138,75,.55)}
@keyframes waveGrow{to{width:218px}}
.ld-sub{color:var(--ink2);font-size:15px;letter-spacing:3px;opacity:0;animation:fadeUp .6s ease 1.15s forwards}
.ld-sub .dot{animation:dotBlink 1.2s infinite}
.ld-sub .d2{animation-delay:.15s}.ld-sub .d3{animation-delay:.3s}
@keyframes dotBlink{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ripple{position:absolute;width:200px;height:200px;border-radius:50%;border:2px solid rgba(191,95,47,.28);animation:rip 2.1s ease-out infinite;pointer-events:none}
.ripple.r2{animation-delay:1.05s}
@keyframes rip{0%{transform:scale(.38);opacity:.9}100%{transform:scale(2.15);opacity:0}}

/* ================= 布局 ================= */
#app{display:flex;height:100vh}
.side{width:228px;flex:none;height:100%;background:linear-gradient(180deg,#faf2df,#f3e4c6);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:12px;padding:2px 6px 18px;border-bottom:1px dashed var(--line2);margin-bottom:14px}
.logo-mark{width:46px;height:46px;flex:none;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:23px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(191,95,47,.35)}
.logo-name{font-size:21px;font-weight:900;color:var(--accdeep);letter-spacing:3px}
.logo-sub{font-size:11px;color:var(--ink3);letter-spacing:1px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border:none;border-radius:12px;background:transparent;color:var(--ink2);font-size:14.5px;font-weight:600;cursor:pointer;transition:all .18s;text-align:left}
.nav-item .ic{font-size:17px}
.nav-item:hover{background:rgba(191,95,47,.08);color:var(--ink)}
.nav-item.active{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 14px rgba(191,95,47,.3)}
.nav-item .badge{margin-left:auto;font-size:11px;background:rgba(255,255,255,.85);color:var(--accdeep);border-radius:99px;padding:2px 8px;font-weight:700}
.nav-item.active .badge{background:rgba(255,255,255,.9)}
.nav-item .badge.badge-warn{background:var(--redsoft);color:var(--red)}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px dashed var(--line2);font-size:12px;color:var(--ink3);line-height:1.9;letter-spacing:1px}
.side-foot span{color:#b39a72}
.main{flex:1;min-width:0;height:100%;overflow-y:auto;padding:26px 30px 60px}
.view{display:none;max-width:1200px;margin:0 auto}
.view.active{display:block;animation:viewIn .4s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.v-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.v-title{font-size:24px;font-weight:900;letter-spacing:1px}
.v-sub{font-size:13px;color:var(--ink3);margin-top:5px}

/* ================= 卡片与统计 ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-h h3 .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.stat{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;transition:transform .18s}
.stat:hover{transform:translateY(-2px)}
.stat .s-lab{font-size:12.5px;color:var(--ink3);font-weight:600}
.stat .s-num{font-size:25px;font-weight:800;color:var(--accdeep);margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .s-num small{font-size:13px;color:var(--ink3);font-weight:600}
.stat .s-sub{font-size:12px;color:var(--ink3);margin-top:4px}

/* ================= 按钮 / 表单 ================= */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:11px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 12px rgba(191,95,47,.28);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(191,95,47,.34);filter:brightness(1.04)}
.btn:active{transform:translateY(0)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn.ghost,.btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover,.btn-ghost:hover{background:var(--accsoft);color:var(--accdeep);box-shadow:none}
.btn-danger{background:linear-gradient(135deg,#c24f3a,#d4765f);box-shadow:0 4px 12px rgba(194,79,58,.25)}
.btn.green{background:linear-gradient(135deg,#5f8b4b,#7aa768);box-shadow:0 4px 12px rgba(95,139,75,.25)}
.link-btn{background:none;border:none;color:var(--acc);font-weight:700;font-size:12.5px;cursor:pointer}
.link-btn:hover{text-decoration:underline}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);background:#fffdf6;border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;width:100%;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(217,138,75,.15)}
textarea{resize:vertical;min-height:88px;line-height:1.7}
label{font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:.5px}
.f-row{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--ink2);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--acc2);color:var(--accdeep)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(191,95,47,.3)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tag{display:inline-flex;align-items:center;border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag-xc{background:var(--accsoft);color:var(--accdeep)}
.tag-sl{background:var(--bluesoft);color:var(--blue)}
.tag-gold{background:var(--goldsoft);color:var(--gold)}
.tag-green{background:var(--greensoft);color:var(--green)}
.tag-red{background:var(--redsoft);color:var(--red)}
.tag-gray{background:#efe8d8;color:var(--ink3)}

.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line2)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.tbl th{background:var(--card2);color:var(--ink2);text-align:left;padding:10px 12px;font-size:12px;letter-spacing:.5px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px dashed var(--line2);vertical-align:middle}
.tbl tr:hover td{background:#fdf8ec}

.t-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card2);border:1px solid var(--line2);border-radius:13px}
.t-item+.t-item{margin-top:10px}
.t-item.done{opacity:.66}
.t-item.done .t-title{text-decoration:line-through;color:var(--ink3)}
.t-title{font-size:14.5px;font-weight:700}
.t-meta{font-size:12px;color:var(--ink3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;line-height:1.7}
.t-info{flex:1;min-width:0}
.t-right{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.rate-badge{font-size:12px;font-weight:800;color:var(--green);background:var(--greensoft);border-radius:99px;padding:3px 10px}

.bar{height:10px;border-radius:99px;background:#efe3ca;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s ease}
.bar>i.green{background:linear-gradient(90deg,#5f8b4b,#7aa768)}

/* ================= 首页 ================= */
.cd-big{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cd-cell{flex:1;min-width:74px;max-width:112px;background:linear-gradient(180deg,#fffefb,#fbeed8);border:1px solid var(--line);border-radius:14px;padding:14px 6px 10px;text-align:center;box-shadow:inset 0 -3px 0 rgba(191,95,47,.08)}
.cd-num{font-size:34px;font-weight:900;color:var(--accdeep);font-variant-numeric:tabular-nums;line-height:1.1}
.cd-lab{font-size:12px;color:var(--ink3);margin-top:6px;letter-spacing:2px}
.cd-state{margin-top:12px;text-align:center;font-size:12.5px;color:var(--ink3)}
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:10px}
.node{background:#fffdf6;border:1px dashed #e2d0ab;border-radius:12px;padding:10px 12px}
.node .n-lab{font-size:12.5px;font-weight:700;color:var(--ink2)}
.node .n-date{font-size:11.5px;color:var(--ink3);margin-top:2px}
.node .n-cd{margin-top:6px;font-size:13.5px;font-weight:800;color:var(--accdeep);font-variant-numeric:tabular-nums}
.node .n-cd b{font-size:14px}
.node .n-cd .past{color:var(--ink3);font-weight:600}
.exam-chip{display:inline-flex;align-items:center;gap:8px;background:var(--accsoft);color:var(--accdeep);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700}
.study-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring-box{position:relative;width:118px;height:118px;flex:none}
.ring{width:118px;height:118px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .rbg{stroke:#f0e3c8}
.ring .rfg{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-num b{font-size:19px;color:var(--accdeep);font-variant-numeric:tabular-nums}
.ring-num span{font-size:11px;color:var(--ink3);margin-top:2px}
.home-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}

/* ================= 图表 ================= */
.chart{display:block}
.grid{stroke:#eee2c8;stroke-width:1}
.ref{stroke:#c24f3a;stroke-width:1.5;stroke-dasharray:5 4;opacity:.7}
.tick{font-size:10.5px;fill:var(--ink3);text-anchor:end}
.tickX{text-anchor:middle}
.legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.lg-item{display:inline-flex;align-items:center;gap:6px}
.lg-item i{width:10px;height:10px;border-radius:3px;display:inline-block}
.line-val{font-size:10.5px;fill:var(--ink2);text-anchor:middle;font-weight:700}
.line-dot{stroke:#fff;stroke-width:2}
.hb{margin-bottom:11px}
.hb-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;color:var(--ink2)}
.hb-val{font-weight:800;color:var(--accdeep)}
.hb-track{height:10px;border-radius:99px;background:#f0e3c8;overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:99px;transition:width .5s ease}

/* ================= 弹窗 / 提示 ================= */
.m-mask{position:fixed;inset:0;z-index:1000;background:rgba(70,54,32,.38);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:maskIn .2s ease}
.m-card{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:18px;box-shadow:0 24px 60px rgba(70,50,20,.25);padding:20px 22px;animation:popIn .22s cubic-bezier(.3,1.2,.4,1)}
.m-card.m-wide{width:min(660px,100%)}
.m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.m-head h3{font-size:17px;font-weight:900}
.m-x{border:none;background:var(--card2);width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--ink2);cursor:pointer;line-height:1;flex:none}
.m-x:hover{background:var(--redsoft);color:var(--red)}
.m-text{font-size:14px;color:var(--ink2);line-height:1.9}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
#toast-root{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:1200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#4a3a26;color:#fdf6e8;font-size:13.5px;padding:10px 20px;border-radius:99px;box-shadow:0 10px 26px rgba(74,58,38,.3);animation:toastIn .3s ease;font-weight:600;max-width:82vw}
.toast-err{background:#8f3a28}
.toast.out{opacity:0;transform:translateY(8px);transition:all .4s}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

.empty{padding:38px 12px;text-align:center;color:var(--ink3);font-size:13.5px;line-height:2.1}
.empty .e-ic{font-size:38px;display:block;margin-bottom:8px}
.rate-preview{margin-top:8px;font-size:13px;color:var(--green);font-weight:700}
.rate-preview b{font-size:16px}
.wdbox{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.wd{border:1px solid var(--line);border-radius:10px;padding:8px 0;width:52px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--card2);transition:all .15s;display:flex;align-items:center;justify-content:center}
.wd input{display:none}
.wd.on{background:var(--accsoft);border-color:var(--acc2);color:var(--accdeep)}
/* 重复方式：左右两个小方块选择 */
.rep-seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rep-opt{border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:center;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;background:#fffdf6;transition:all .15s;user-select:none}
.rep-opt:hover{border-color:var(--acc2)}
.rep-opt.on{border-color:var(--acc2);background:var(--accsoft);color:var(--accdeep)}

/* ================= 笔记 / 复盘 / 个人中心 ================= */
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.note-card{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:16px 18px;transition:transform .18s}
.note-card:hover{transform:translateY(-2px)}
.note-content{font-size:13.5px;line-height:1.8;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;margin-top:10px}
.rev-card{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:16px 18px}
.rev-card+.rev-card{margin-top:12px}
.rev-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rev-body{margin-top:10px;font-size:13px;line-height:1.9;color:var(--ink2)}
.rev-body b{color:var(--ink)}
.rev-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.p-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px dashed var(--line2);flex-wrap:wrap}
.p-row:last-child{border-bottom:none}
.p-row .p-lab{font-size:13.5px;font-weight:700;color:var(--ink)}
.p-row .p-lab small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:2px}
.p-ctl{width:190px}
.p-hint{font-size:12px;color:var(--ink3);line-height:1.9}
/* 个人中心：考试日期选择（覆盖原生占位符，始终显示中文日期） */
.date-pick{position:relative}
.date-pick .dt-txt{width:100%;cursor:pointer;padding-right:38px}
.date-pick .dt-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:14px;opacity:.55}
.date-pick input[type=date]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1;border:0;padding:0}
.date-pick.disabled .dt-txt{background:#f2ecdf;color:var(--ink3);cursor:not-allowed}

/* ================= 响应式 ================= */
/* iPad Air 11寸（834×1194）：完整侧边栏 + 单列首页 */
@media(max-width:1000px){.home-grid{grid-template-columns:1fr}}
/* 窄平板（≤780px）：图标侧边栏 */

<script>
'use strict';
/* ================= 常量与预设 ================= */
const LS_KEY='shangan_workbench_v1';
const NS='http://www.w3.org/2000/svg';
const WDAY=['一','二','三','四','五','六','日'];
const ROUTES=['home','tasks','study','mock','stats','notes','review','profile'];
const SUBJECTS={
 '行测':['常识判断','言语理解与表达','数量关系','判断推理','资料分析','其他'],
 '申论':['归纳概括','综合分析','提出对策','贯彻执行','文章写作（大作文）','素材积累','其他']
};
const MOD_SHORT={'常识判断':'常识','言语理解与表达':'言语','数量关系':'数量','判断推理':'判断','资料分析':'资料','归纳概括':'归纳','综合分析':'综合','提出对策':'对策','贯彻执行':'贯彻','文章写作（大作文）':'写作','素材积累':'素材','其他':'其他'};
const ERR_TYPES=['知识点不熟','粗心大意','审题不清','方法不当','时间分配','其他'];
const NODES=[['register','报名'],['confirm','资格确认'],['pay','缴费'],['admit','打印准考证'],['exam','笔试']];
/* 2027年度考试时间按往年规律预估，可在个人中心修改，以官方公告为准 */
const EXAM_PRESETS=[
 {id:'gk2027',name:'2027年国家公务员考试（国考）',type:'国考',register:'2026-10-15',confirm:'2026-10-26',pay:'2026-11-01',admit:'2026-11-23',exam:'2026-11-29'},
 {id:'lk2027',name:'2027年省考·多省联考',type:'省考',register:'2027-02-15',confirm:'2027-02-24',pay:'2027-02-28',admit:'2027-03-21',exam:'2027-03-28'},
 {id:'js2027',name:'2027年江苏省考',type:'省考',register:'2026-11-10',confirm:'2026-11-14',pay:'2026-11-16',admit:'2026-12-15',exam:'2026-12-19'},
 {id:'sd2027',name:'2027年山东省考',type:'省考',register:'2026-11-08',confirm:'2026-11-12',pay:'2026-11-14',admit:'2026-12-08',exam:'2026-12-13'},
 {id:'zj2027',name:'2027年浙江省考',type:'省考',register:'2026-11-03',confirm:'2026-11-10',pay:'2026-11-12',admit:'2026-12-08',exam:'2026-12-13'},
 {id:'gd2027',name:'2027年广东省考',type:'省考',register:'2027-01-06',confirm:'2027-01-12',pay:'2027-01-15',admit:'2027-03-10',exam:'2027-03-14'},
 {id:'sydw1_2027',name:'2027年事业单位联考（上半年）',type:'事业编',register:'2027-02-22',confirm:'2027-03-01',pay:'2027-03-03',admit:'2027-03-22',exam:'2027-03-27'},
 {id:'sydw2_2027',name:'2027年事业单位联考（下半年）',type:'事业编',register:'2027-09-15',confirm:'2027-09-22',pay:'2027-09-24',admit:'2027-10-25',exam:'2027-10-30'}
];

/* ================= 状态（localStorage） ================= */
function defaultState(){return {settings:{nickname:'',targetExamId:'gk2027',dailyTargetHours:8,dailyTargetTasks:6,goalScore:null},exams:[],tasks:[],study:{},mocks:[],notes:[],reviews:[]}}
let state=null;
function loadState(){
 try{
  const raw=localStorage.getItem(LS_KEY);
  if(!raw)return null;
  const d=JSON.parse(raw);
  const def=defaultState();
  return {
   ...def,...d,
   settings:{...def.settings,...(d.settings||{})},
   exams:Array.isArray(d.exams)?repairExams(d.exams):[],
   tasks:Array.isArray(d.tasks)?d.tasks.map(t=>({...(t&&typeof t==='object'?t:{}),instances:(t&&t.instances&&typeof t.instances==='object')?t.instances:{},weekdays:Array.isArray(t&&t.weekdays)?t.weekdays:[]})):[],
   study:(d.study&&typeof d.study==='object')?d.study:{},
   mocks:Array.isArray(d.mocks)?d.mocks:[],
   notes:Array.isArray(d.notes)?d.notes:[],
   reviews:Array.isArray(d.reviews)?d.reviews:[]
  };
 }catch(e){return null}
}
function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){toast('数据保存失败：'+e.message,'err')}}

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr=()=>dstr(new Date());
const parseD=s=>{
 if(typeof s!=='string'||!s)return new Date(NaN);
 const p=s.split('-').map(Number);
 if(p.length<3||p.some(isNaN))return new Date(NaN);
 return new Date(p[0],p[1]-1,p[2]);
};
const wdayOf=s=>{
 const d=parseD(s);
 if(isNaN(d.getTime()))return NaN;
 const w=d.getDay();
 return w===0?7:w;
};
const addDays=(s,n)=>{const d=parseD(s);if(isNaN(d.getTime()))return '';d.setDate(d.getDate()+n);return dstr(d)};
const mondayOf=s=>{const w=wdayOf(s);return isNaN(w)?'':addDays(s,1-w)};
const cnDate=s=>{
 const d=parseD(s);
 if(isNaN(d.getTime()))return '日期无效';
 const mo=d.getMonth()+1,da=d.getDate(),wd=wdayOf(s);
 if(isNaN(mo)||isNaN(da))return '日期无效';
 return mo+'月'+da+'日 周'+(isNaN(wd)?'?':WDAY[wd-1]||'?');
};
function isValidDateStr(s){
 if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
 const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
 const mo=+m[2],da=+m[3];
 if(mo<1||mo>12||da<1||da>31)return false;
 const d=new Date(+m[1],mo-1,da);
 return d.getMonth()===mo-1&&d.getDate()===da;
}
function normalizeDateStr(v){
 if(typeof v!=='string')return '';
 v=v.trim();
 if(isValidDateStr(v))return v;
 let m=/^(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})日?$/.exec(v);
 if(m){const r=m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);return isValidDateStr(r)?r:'';}
 m=/^(\d{1,2})月(\d{1,2})日?$/.exec(v);
 if(m){const r=new Date().getFullYear()+'-'+pad2(+m[1])+'-'+pad2(+m[2]);return isValidDateStr(r)?r:'';}
 m=/^(\d{1,2})[-/](\d{1,2})$/.exec(v);
 if(m){const r=new Date().getFullYear()+'-'+pad2(+m[1])+'-'+pad2(+m[2]);return isValidDateStr(r)?r:'';}
 return '';
}
function fmtDateCn(s){
 if(!isValidDateStr(s))return '';
 const d=parseD(s);
 if(isNaN(d.getTime()))return '';
 const mo=d.getMonth()+1,da=d.getDate(),wd=wdayOf(s);
 if(isNaN(mo)||isNaN(da))return '';
 return d.getFullYear()+'年'+mo+'月'+da+'日 周'+(isNaN(wd)?'?':WDAY[wd-1]||'?');
}
/* 载入/导入数据时自动修复考试日期：兼容 2026/11/29、2026年11月29日 等格式，无法识别则回退官方预设 */
function repairExams(list){
 if(!Array.isArray(list))return [];
 return list.map(e=>{
  const out={...(e&&typeof e==='object'?e:{})};
  const preset=EXAM_PRESETS.find(p=>p.id===out.id);
  NODES.forEach(([k])=>{
   const v=out[k];
   if(v===undefined||v===null){out[k]='';return;}
   if(typeof v!=='string'){out[k]='';return;}
   const n=normalizeDateStr(v);
   out[k]=n||(preset?preset[k]:'');
  });
  return out;
 });
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pct=(a,b)=>b>0?Math.round(a/b*1000)/10:0;
const fmtMin=m=>{const h=Math.floor(m/60),mm=Math.round(m%60);return (h?h+'小时':'')+(mm?mm+'分钟':'')||'0分钟'};
const fmtMinC=m=>{const h=Math.floor(m/60),mm=Math.round(m%60);return (h?h+'h':'')+(mm?mm+'m':'')||'0m'};
function currentExam(){return state.exams.find(e=>e.id===state.settings.targetExamId)||null}

/* ================= 提示与弹窗 ================= */
function toast(msg,type){
 const root=$('#toast-root');
 const t=document.createElement('div');
 t.className='toast'+(type==='err'?' toast-err':'');
 t.textContent=msg;
 root.appendChild(t);
 setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400)},2100);
}
function openModal(o){
 const root=$('#modal-root');
 root.innerHTML=`<div class="m-mask"><div class="m-card${o.wide?' m-wide':''}"><div class="m-head"><h3>${esc(o.title)}</h3><button class="m-x" data-close aria-label="关闭">×</button></div><div class="m-body">${o.body}</div></div></div>`;
 const mask=root.firstElementChild,card=mask.firstElementChild;
 const close=()=>{root.innerHTML=''};
 mask.addEventListener('click',e=>{if(e.target===mask)close()});
 card.addEventListener('click',e=>{if(e.target.closest('[data-close]'))close()});
 card.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();const ok=card.querySelector('[data-ok]');if(ok)ok.click()}});
 if(o.onOpen)o.onOpen(card,close);
 return close;
}
function confirmBox(o){
 openModal({title:o.title||'确认操作',body:`<p class="m-text">${esc(o.text||'确定要执行该操作吗？')}</p><div class="m-actions"><button class="btn btn-ghost" data-close>取消</button><button class="btn ${o.danger?'btn-danger':''}" data-ok>${esc(o.okText||'确定')}</button></div>`,
 onOpen:(card,close)=>{card.querySelector('[data-ok]').onclick=()=>{close();if(o.onOk)o.onOk()}}});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal-root').innerHTML=''});

/* ================= 图表引擎（SVG 自绘，离线可用） ================= */
function barChart(el,o){
 if(!el||!o.labels.length)return;
 const W=Math.max(el.clientWidth||320,320);
 const m={t:16,r:10,b:38,l:44};
 const iw=W-m.l-m.r,ih=o.height- m.t-m.b;
 let max=1;
 o.series.forEach(s=>s.data.forEach(v=>{if(v>max)max=v}));
 max=o.maxVal!=null?o.maxVal:Math.max(1,Math.ceil(max*1.15));
 const svg=document.createElementNS(NS,'svg');
 svg.setAttribute('viewBox','0 0 '+W+' '+o.height);
 svg.setAttribute('class','chart');svg.style.width='100%';
 for(let i=0;i<=4;i++){
  const y=m.t+ih-ih*i/4;
  const ln=document.createElementNS(NS,'line');
  ln.setAttribute('x1',m.l);ln.setAttribute('x2',W-m.r);ln.setAttribute('y1',y);ln.setAttribute('y2',y);
  ln.setAttribute('class','grid');svg.appendChild(ln);
  const tx=document.createElementNS(NS,'text');
  tx.setAttribute('x',m.l-7);tx.setAttribute('y',y+3.5);tx.setAttribute('class','tick');
  tx.textContent=Math.round(max*i/4*10)/10;svg.appendChild(tx);
 }
 const n=o.labels.length,gw=iw/n;
 const bw=Math.min(16,Math.max(5,gw*0.26));
 const off=(o.series.length-1)/2;
 o.series.forEach((s,si)=>{
  s.data.forEach((v,i)=>{
   const x=m.l+gw*i+gw/2+(si-off)*bw-bw/2;
   const h=Math.max(v>0?2.5:0,v/max*ih);
   const y=m.t+ih-h;
   const r=document.createElementNS(NS,'rect');
   r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',bw);r.setAttribute('height',h);
   r.setAttribute('rx',3);r.setAttribute('fill',(s.colors&&s.colors[i])||s.color);
   const tt=document.createElementNS(NS,'title');
   tt.textContent=o.labels[i]+' · '+s.name+'：'+v+(o.unit||'');
   r.appendChild(tt);svg.appendChild(r);
  });
 });
 const step=Math.ceil(n/10);
 o.labels.forEach((lb,i)=>{
  if(i%step!==0&&i!==n-1)return;
  const tx=document.createElementNS(NS,'text');
  tx.setAttribute('x',m.l+gw*i+gw/2);tx.setAttribute('y',o.height-11);
  tx.setAttribute('class','tick tickX');tx.textContent=lb;svg.appendChild(tx);
 });
 el.innerHTML='';el.appendChild(svg);
 const hasColors=o.series.some(s=>s.colors);
 const lg=document.createElement('div');lg.className='legend';
 lg.innerHTML=o.series.filter(s=>!s.colors).map(s=>`<span class="lg-item"><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')
  +(hasColors?`<span class="lg-item"><i style="background:#bf5f2f"></i>行测</span><span class="lg-item"><i style="background:#4a7a9b"></i>申论</span>`:'');
 el.appendChild(lg);
}
function lineChart(el,o){
 if(!el)return;
 const vals=o.data.filter(v=>v!=null);
 if(!vals.length){el.innerHTML='<div class="empty">暂无数据</div>';return}
 const W=Math.max(el.clientWidth||320,320);
 const m={t:18,r:12,b:36,l:44};
 const iw=W-m.l-m.r,ih=o.height- m.t-m.b;
 let mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
 let lo=o.ymin!=null?o.ymin:Math.floor((mn-(mx-mn)*0.2)||mn*0.8);
 let hi=o.ymax!=null?o.ymax:Math.ceil((mx+(mx-mn)*0.2)||mx*1.2);
 if(hi-lo<2){lo-=1;hi+=1}
 if(lo<0)lo=0;
 const svg=document.createElementNS(NS,'svg');
 svg.setAttribute('viewBox','0 0 '+W+' '+o.height);
 svg.setAttribute('class','chart');svg.style.width='100%';
 for(let i=0;i<=4;i++){
  const y=m.t+ih-ih*i/4;
  const ln=document.createElementNS(NS,'line');
  ln.setAttribute('x1',m.l);ln.setAttribute('x2',W-m.r);ln.setAttribute('y1',y);ln.setAttribute('y2',y);
  ln.setAttribute('class','grid');svg.appendChild(ln);
  const tx=document.createElementNS(NS,'text');
  tx.setAttribute('x',m.l-7);tx.setAttribute('y',y+3.5);tx.setAttribute('class','tick');
  tx.textContent=Math.round((lo+(hi-lo)*i/4)*10)/10;svg.appendChild(tx);
 }
 if(o.refY!=null&&o.refY>=lo&&o.refY<=hi){
  const y=m.t+ih-(o.refY-lo)/(hi-lo)*ih;
  const ln=document.createElementNS(NS,'line');
  ln.setAttribute('x1',m.l);ln.setAttribute('x2',W-m.r);ln.setAttribute('y1',y);ln.setAttribute('y2',y);
  ln.setAttribute('class','ref');svg.appendChild(ln);
  const tx=document.createElementNS(NS,'text');
  tx.setAttribute('x',m.l+5);tx.setAttribute('y',y-5);tx.setAttribute('class','tick');
  tx.textContent=o.refLabel||'目标';svg.appendChild(tx);
 }
 const n=o.data.length;
 const X=i=>n===1?m.l+iw/2:m.l+iw*i/(n-1);
 const Y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
 let seg=[];
 function drawSeg(pts){
  if(pts.length<2)return;
  const pl=document.createElementNS(NS,'polyline');
  pl.setAttribute('points',pts.map(p=>p.join(',')).join(' '));
  pl.setAttribute('fill','none');pl.setAttribute('stroke',o.color||'#bf5f2f');pl.setAttribute('stroke-width',2.5);
  pl.setAttribute('stroke-linejoin','round');pl.setAttribute('stroke-linecap','round');
  svg.appendChild(pl);
 }
 o.data.forEach((v,i)=>{if(v==null){drawSeg(seg);seg=[]}else seg.push([X(i),Y(v)])});
 drawSeg(seg);
 o.data.forEach((v,i)=>{
  if(v==null)return;
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',X(i));c.setAttribute('cy',Y(v));c.setAttribute('r',4);
  c.setAttribute('fill',o.color||'#bf5f2f');c.setAttribute('class','line-dot');svg.appendChild(c);
  if(n<=12){
   const tx=document.createElementNS(NS,'text');
   tx.setAttribute('x',X(i));tx.setAttribute('y',Y(v)-9);tx.setAttribute('class','line-val');
   tx.textContent=Math.round(v*10)/10+(o.unit||'');svg.appendChild(tx);
  }
 });
 const step=Math.ceil(n/10);
 o.labels.forEach((lb,i)=>{
  if(i%step!==0&&i!==n-1)return;
  const tx=document.createElementNS(NS,'text');
  tx.setAttribute('x',X(i));tx.setAttribute('y',o.height-9);
  tx.setAttribute('class','tick tickX');tx.textContent=lb;svg.appendChild(tx);
 });
 el.innerHTML='';el.appendChild(svg);
}
function hbarList(el,rows,max){
 if(!el)return;
 if(!rows.length){el.innerHTML='<div class="empty">暂无数据</div>';return}
 const m=max||Math.max.apply(null,rows.map(r=>r.value))||1;
 el.innerHTML=rows.map(r=>`<div class="hb"><div class="hb-label"><span>${esc(r.label)}</span><span class="hb-val">${esc(r.text)}</span></div><div class="hb-track"><i style="width:${Math.max(2,r.value/m*100)}%;background:${r.color||'var(--acc)'}"></i></div></div>`).join('');
}

/* ================= 路由与实时同步 ================= */
let current='home';
function go(r){
 if(!ROUTES.includes(r))r='home';
 current=r;
 try{history.replaceState(null,'','#/'+r)}catch(e){location.hash='#/'+r}

/* ================= 倒计时 ================= */
function cdText(target,at){
 if(!target)return null;
 const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(target));
 if(!m)return null;
 const mo=+m[2],da=+m[3];
 if(mo<1||mo>12||da<1||da>31)return null;
 const dd=new Date(+m[1],mo-1,da);
 if(dd.getMonth()!==mo-1||dd.getDate()!==da)return null;
 const t=dd.getTime()+(at==='09:00'?9*3600e3:0);
 const ms=t-Date.now();
 if(ms<=0)return null;
 const s=Math.floor(ms/1000);
 return {d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60};
}
function cdInline(p){
 if(!p)return '<span class="past">已结束</span>';
 if(p.d===0)return `今天 <b>${pad2(p.h)}</b>:<b>${pad2(p.m)}</b>:<b>${pad2(p.s)}</b>`;
 return `<b>${p.d}</b>天 <b>${pad2(p.h)}</b>:<b>${pad2(p.m)}</b>:<b>${pad2(p.s)}</b>`;
}
function tick(){
 if(current!=='home'||!state)return;
 try{
  const ex=currentExam();
  if(!ex)return;
  const p=ex.exam?cdText(ex.exam,'09:00'):null;
  ['d','h','m','s'].forEach(k=>{
   const el=$('#cd-ex-'+k);
   if(el)el.textContent=p?String(k==='d'?p.d:pad2(p[k])):'0';
  });
  const stEl=$('#cd-ex-state');
  if(stEl){
   if(p)stEl.innerHTML='距笔试：'+cnDate(ex.exam)+'（以当日 09:00 开考计）';
   else if(ex.exam)stEl.innerHTML='笔试时间已过或日期无效 · 新目标可在个人中心设置';
  }
  $$('#view-home .n-cd').forEach(el=>{
   const k=el.dataset.t;
   const at=el.dataset.at||'00:00';
   if(!ex[k]){el.innerHTML='<span class="past">待定</span>';return}
   const pp=cdText(ex[k],at);
   el.innerHTML=pp?cdInline(pp):'<span class="past">已结束</span>';
  });
 }catch(e){}
}

 }});

/* ================= 任务模块 ================= */
let tasksTab='today',tasksChartTab='d';
function dueOn(t,ds){
 if(t.repeat==='weekly')return ds>=t.date&&(t.weekdays||[]).includes(wdayOf(ds));
 return t.date===ds;
}
function instDone(t,ds){const it=(t.instances||{})[ds];return !!(it&&it.done)}
function dayStats(ds){
 let due=0,done=0,cor=0,tot=0;
 state.tasks.forEach(t=>{
  if(dueOn(t,ds)){
   due++;
   const it=(t.instances||{})[ds];
   if(it&&it.done){done++;if(t.target>0&&it.correct!=null){cor+=it.correct;tot+=t.target}}
  }
 });
 return {due,done,rate:pct(done,due),cor,tot};
}
function sumStats(list){let due=0,done=0,cor=0,tot=0;list.forEach(s=>{due+=s.due;done+=s.done;cor+=s.cor;tot+=s.tot});return {due,done,rate:pct(done,due),cor,tot}}
function taskChartData(mode){
 const today=todayStr();
 if(mode==='d'){
  const arr=[];
  for(let i=13;i>=0;i--){const ds=addDays(today,-i);arr.push({label:ds.slice(5),s:dayStats(ds)})}
  return arr;
 }
 if(mode==='w'){
  const arr=[];
  for(let i=7;i>=0;i--){
   const mon=mondayOf(addDays(today,-7*i));
   const days=[];
   for(let j=0;j<7;j++){const ds=addDays(mon,j);if(ds>today)break;days.push(dayStats(ds))}
   arr.push({label:mon.slice(5)+'周',s:sumStats(days)});
  }
  return arr;
 }
 const now=new Date(),arr=[];
 for(let i=5;i>=0;i--){
  const y=now.getFullYear(),mm=now.getMonth()-i;
  const first=new Date(y,mm,1);
  const days=[];
  for(let d=first;dstr(d)<=today;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))days.push(dayStats(dstr(d)));
  arr.push({label:first.getFullYear()+'-'+pad2(first.getMonth()+1),s:sumStats(days)});
 }
 return arr;
}

 const rate=done&&t.target>0&&it.correct!=null?pct(it.correct,t.target):null;

 return `<div class="t-item ${done?'done':''}">
  <span class="tag ${t.subject==='行测'?'tag-xc':'tag-sl'}">${esc(t.subject)}</span>
  <div class="t-info"><div class="t-title">${esc(t.title)}</div><div class="t-meta"><span>${esc(t.module)}</span>${t.target?`<span>目标 ${t.target} 题</span>`:''}<span>${rep}</span>${statusChip}</div></div>

   ${done?(rate!=null?`<span class="rate-badge">正确率 ${rate}%</span>`:'')+(all?'':`<button class="btn sm btn-ghost" data-act="undo" data-id="${t.id}">撤销</button>`):`<button class="btn sm" data-act="complete" data-id="${t.id}">完成</button>`}

}

/* 解析番茄ToDo等专注记录的粘贴文本：每行一条，如 "10月28日 90分钟" / "2026-10-28 1小时30分" */
function parseFocusText(text,fallbackDate){
 const rows=[];
 if(typeof fallbackDate!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(fallbackDate))fallbackDate=todayStr();
 const year=parseInt(fallbackDate.slice(0,4),10);
 String(text||'').split(/\n+/).forEach(line=>{
  line=line.replace(/[，,;；]\s*$/,'').trim();
  if(!line)return;
  let ds=null;
  const m1=line.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})日?/);
  const m2=line.match(/(\d{1,2})月(\d{1,2})日?/);
  const m3=line.match(/(\d{1,2})[-\/](\d{1,2})(?!\d)/);
  if(m1)ds=m1[1]+'-'+pad2(+m1[2])+'-'+pad2(+m1[3]);
  else if(m2)ds=year+'-'+pad2(+m2[1])+'-'+pad2(+m2[2]);
  else if(m3)ds=year+'-'+pad2(+m3[1])+'-'+pad2(+m3[2]);
  if(!ds)ds=fallbackDate;
  if(isNaN(parseD(ds).getTime()))return;
  let min=0;
  const hm=line.match(/(\d+(?:\.\d+)?)\s*(?:小时|时|h|H)/);
  const mm=line.match(/(\d+(?:\.\d+)?)\s*(?:分钟|分|min|m)(?!\s*(?:小时|时|h|H))/);
  if(hm)min+=parseFloat(hm[1])*60;
  if(mm)min+=parseFloat(mm[1]);
  if(min===0){
   const dm=m1||m2||m3;
   let after=dm?line.slice(dm.index+dm[0].length):line;
   const nn=after.match(/(\d+(?:\.\d+)?)/);
   if(nn)min=Math.round(parseFloat(nn[1]));
  }
  min=Math.round(min);
  if(min>0&&min<=1440)rows.push({date:ds,min,raw:line});
 });
 return rows;
}

 });

   state={...def,...d,settings:{...def.settings,...(d.settings||{})},exams:Array.isArray(d.exams)?repairExams(d.exams):[],tasks:d.tasks.map(t=>({...(t&&typeof t==='object'?t:{}),instances:(t&&t.instances&&typeof t.instances==='object')?t.instances:{},weekdays:Array.isArray(t&&t.weekdays)?t.weekdays:[]})),study:(d.study&&typeof d.study==='object')?d.study:{},mocks:Array.isArray(d.mocks)?d.mocks:[],notes:Array.isArray(d.notes)?d.notes:[],reviews:Array.isArray(d.reviews)?d.reviews:[]};
   refresh();toast('数据导入成功 ✓');

 };
 r.readAsText(file);
}

 v.querySelector('#p-import').onclick=()=>v.querySelector('#p-file').click();
 v.querySelector('#p-file').onchange=e=>{const f=e.target.files[0];if(f)importData(f);e.target.value=''};
 v.querySelector('#p-clear').onclick=()=>confirmBox({title:'清空所有数据',text:'将删除任务、学习记录、模考、笔记、复盘等全部数据，且无法恢复。建议先导出备份。',danger:true,okText:'确认清空',onOk:()=>{localStorage.removeItem(LS_KEY);location.reload()}});
}

/* ================= 初始化 ================= */
function init(){
 /* 先注册秒表与恢复刷新，任何后续异常都不影响倒计时走动 */
 setInterval(tick,1000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
 window.addEventListener('focus',tick);
 state=loadState();
 if(!state){
  state=defaultState();
  state.exams=EXAM_PRESETS.map(e=>({...e}));
  persist();
 }
 $$('.nav-item').forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));
 const r=(location.hash||'#/home').slice(2);
 try{go(ROUTES.includes(r)?r:'home')}catch(e){console.error('init error:',e);toast('初始化出错：'+e.message,'err')}
}
window.addEventListener('DOMContentLoaded',()=>{
 init();
 setTimeout(()=>{
  const l=$('#loader');
  if(l){l.classList.add('done');setTimeout(()=>l.remove(),800)}
 },2300);
});
</script>
<script>
// PWA Service Worker 注册
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('SW registered:', reg.scope))
      .catch((err) => console.log('SW failed:', err));
  });
}
</script>
